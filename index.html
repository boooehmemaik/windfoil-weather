    try {
      if (JSON.parse(localStorage.getItem("wf_theme")) === "light") {
        document.documentElement.style.background = document.body.style.background = "#e7edf3";
        var b = document.getElementById("boot");
        if (b) { b.style.background = "#e7edf3"; b.style.color = "#5b7186"; }

  <script>

// ── Unit conversion (all internals in m/s) ───────────────────────────────────
const msToKn  = ms => ms * 1.94384;
const knToMs  = kn => kn / 1.94384;
const msToBf  = ms => {
  if(ms<0.3) return 0; if(ms<1.6) return 1; if(ms<3.4) return 2;
  if(ms<5.5) return 3; if(ms<8.0) return 4; if(ms<10.8) return 5;
  if(ms<13.9) return 6; if(ms<17.2) return 7; if(ms<20.8) return 8;
  if(ms<24.5) return 9; if(ms<28.5) return 10; if(ms<32.7) return 11;
  return 12;
};

function calcKiteWindow(kiteMinKn, kiteMaxKn, skill, weight) {
  const sm={beginner:1.15,intermediate:1.0,advanced:0.9,pro:0.85}[skill]??1.0;
  const wm=Math.max(0.85,Math.min(1.2,weight/80));
  const minMs=knToMs(kiteMinKn)*sm*wm;
  const maxMs=knToMs(kiteMaxKn)/sm;
  const span=maxMs-minMs;
  return{
    minWind:Math.round(minMs*10)/10,
    optMin :Math.round((minMs+span*0.15)*10)/10,
    optMax :Math.round((minMs+span*0.75)*10)/10,
    maxWind:Math.round(maxMs*10)/10,
  };
}

function kiteRec(effW,midG,win,kiteModel,kiteSize,skill,windUnit){
  const lines=[];
  if(effW<win.minWind){
    lines.push(t('kite_rec_too_little',{w:fmtW(effW,windUnit),min:fmtW(win.minWind,windUnit)}));
    lines.push(t('kite_rec_too_little_tip'));
  } else if(effW<=win.optMax){
    lines.push(t('kite_rec_optimal',{w:fmtW(effW,windUnit),optMin:fmtW(win.optMin,windUnit),optMax:fmtW(win.optMax,windUnit)}));
    lines.push(t('kite_rec_optimal_rider',{model:kiteModel,size:kiteSize,skill}));
  } else if(effW<=win.maxWind){
    lines.push(t('kite_rec_overpowered',{w:fmtW(effW,windUnit)}));
    lines.push(t('kite_rec_overpowered_tip'));
  } else {
    lines.push(t('kite_rec_too_much',{w:fmtW(effW,windUnit),max:fmtW(win.maxWind,windUnit)}));
    lines.push(t('kite_rec_too_much_tip'));
  }
  if(midG-effW>4) lines.push(t('kite_rec_gust',{dw:fmtW(midG-effW,windUnit)}));
  lines.push(t('kite_rec_window',{min:fmtW(win.minWind,windUnit),optMin:fmtW(win.optMin,windUnit),optMax:fmtW(win.optMax,windUnit),max:fmtW(win.maxWind,windUnit)}));
  return lines.join("<br>");
}

function cvt(ms, unit) {
  if(unit==="kn") return Math.round(msToKn(ms)*10)/10;
  if(unit==="bf") return msToBf(ms);
  return Math.round(ms*10)/10; // m/s
}
function fmtW(ms, unit) {
  if(unit==="kn") return `${cvt(ms,"kn").toFixed(1)} kn`;
  if(unit==="bf") return `${cvt(ms,"bf")} BF`;
  return `${cvt(ms,"ms").toFixed(1)} m/s`;
}
function unitLabel(unit) {
  return unit==="kn"?"kn":unit==="bf"?"BF":"m/s";
}
// Convert a full array ms→display unit
function cvtArr(arr, unit) { return arr.map(v=>cvt(v,unit)); }

// so dayStartIndices.findIndex("YYYY-MM-DD") always matches correctly
// regardless of user timezone. No Date.toISOString() (= UTC) used.

function localDateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

// ── Parse coordinates from a Google Maps link or raw coords v2.2.0 ───────────
// Supports formats:
//   https://www.google.com/maps/@36.9833,21.6667,14z
//   https://maps.google.com/?q=36.9833,21.6667
//   https://www.google.com/maps/place/.../@36.98,21.66,15z/data=...!3d36.98!4d21.66
//   https://maps.app.goo.gl/...  (shortened — cannot resolve client-side, user warned)
//   "36.9833, 21.6667"  (plain coordinates)
function parseLocationInput(input) {
  if(!input) return null;
  const str = input.trim();

  // Shortened goo.gl links redirect server-side — can't resolve in browser
  if(/maps\.app\.goo\.gl|goo\.gl\/maps/.test(str)) {
    return { error: t('parse_shortlink') };
  }

  // Try @lat,lon (most common in maps URLs)
  let m = str.match(/@(-?\d{1,3}\.\d+),\s*(-?\d{1,3}\.\d+)/);
  if(m) return { lat: parseFloat(m[1]), lon: parseFloat(m[2]) };

  // Try !3dLAT!4dLON (embedded in /data= part — most precise place pin)
  const m3 = str.match(/!3d(-?\d{1,3}\.\d+)/);
  const m4 = str.match(/!4d(-?\d{1,3}\.\d+)/);
  if(m3 && m4) return { lat: parseFloat(m3[1]), lon: parseFloat(m4[1]) };

  // Try q=lat,lon or query=lat,lon or ll=lat,lon
  m = str.match(/[?&](?:q|query|ll|sll)=(-?\d{1,3}\.\d+),\s*(-?\d{1,3}\.\d+)/);
  if(m) return { lat: parseFloat(m[1]), lon: parseFloat(m[2]) };

  // Plain "lat, lon"
  m = str.match(/^\s*(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/);
  if(m) return { lat: parseFloat(m[1]), lon: parseFloat(m[2]) };

  return { error: t('parse_no_coords') };
}

// Extract a readable place name from a maps URL (the /place/<name>/ segment)
function parsePlaceName(input) {
  if(!input) return "";
  const m = input.match(/\/place\/([^/@]+)/);
  if(m) {
    try { return decodeURIComponent(m[1].replace(/\+/g," ")).split(",")[0]; }
    catch(e){ return m[1].replace(/\+/g," ").split(",")[0]; }
  }
  return "";
}

function generateDemoDay(lat, lon, dayOffset) {
  // Build the target LOCAL date for this day
  const base = new Date();
  base.setDate(base.getDate() + dayOffset);
  const dateStr = localDateStr(base); // e.g. "2026-05-31"
  const isNavarino = Math.abs(lat - 36.98) < 0.5;
  const windBase = isNavarino ? 4.2 : 3.8;
  const tempBase = isNavarino ? 22  : 20;
  const times=[], winds=[], gusts=[], dirs=[], temps=[], pres=[], cape=[], li=[], cloud=[], humid=[];
  for (let h = 0; h < 24; h++) {
    // Timestamp purely from local calendar — no UTC conversion
    times.push(`${dateStr}T${String(h).padStart(2,"0")}:00`);
    const seaFactor = h>=10 && h<=19 ? Math.sin(Math.PI*(h-10)/9) : 0;
    const nightDip  = h<7 ? 0.55 : h<10 ? 0.75 : 1.0;
    const w = Math.max(0.5, windBase*nightDip + seaFactor*3.8 + (Math.random()-0.5)*0.8 + dayOffset*0.3);
    winds.push(Math.round(w*10)/10);
    gusts.push(Math.round(w*(1.25+Math.random()*0.2)*10)/10);
    const dir = h<10 ? 45+Math.random()*30 : 240+Math.random()*40;
    dirs.push(Math.round(dir));
    const tVal = tempBase + (h<6 ? -3 : h<14 ? (h-6)*1.1 : (24-h)*0.6-1) + Math.random()*0.8 - dayOffset*0.5;
    temps.push(Math.round(tVal*10)/10);
    pres.push(Math.round((1013+Math.sin(h/8)*1.5+Math.random()*0.5-dayOffset*0.3)*10)/10);
    cape.push(h>=11&&h<=17 ? Math.round(Math.random()*600) : 0);
    li.push(h>=11&&h<=17 ? -(Math.random()*2.5) : 1+Math.random());
    cloud.push(Math.round(Math.random()*30+(h>14?10:0)));
    humid.push(Math.round(55+Math.random()*20-seaFactor*8));
  }
  return{time:times,windspeed_10m:winds,windgusts_10m:gusts,winddirection_10m:dirs,
         temperature_2m:temps,surface_pressure:pres,cape,lifted_index:li,cloudcover:cloud,relativehumidity_2m:humid};
}

function buildDemoForecast(lat, lon) {
  const keys=["time","windspeed_10m","windgusts_10m","winddirection_10m","temperature_2m",
               "surface_pressure","cape","lifted_index","cloudcover","relativehumidity_2m"];
  const merged = Object.fromEntries(keys.map(k=>[k,[]]));
  for(let d=0; d<7; d++){
    const day = generateDemoDay(lat, lon, d);
    keys.forEach(k => merged[k].push(...day[k]));
  }
  return { hourly: merged };
}

function buildDemoHistorical(lat, lon) {
  const times=[], winds=[], temps=[];
  for(let d=7; d>=1; d--){
    const day = generateDemoDay(lat, lon, -d);
    times.push(...day.time); winds.push(...day.windspeed_10m); temps.push(...day.temperature_2m);
  }
  return { hourly:{ time:times, windspeed_10m:winds, temperature_2m:temps } };
}

// ── API with timeout + fallback ───────────────────────────────────────────────
async function fetchWithTimeout(url, ms = 7000) {
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(tid);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  } catch(e) {
    clearTimeout(tid);
    throw e;
  }
}

// Pick the best high-resolution model for a given spot.
// Météo-France AROME-HD (1.5 km) is the gold standard for Alpine/lake thermal
// winds (Lago di Garda: Ora/Peler etc.). Its grid covers France plus most of
// mainland Italy up to ~lon 16 — Torbole, Venedig, Rom, Sardinien are inside;
// Sizilien / Süd-Apulien fall outside and use Open-Meteo best_match instead.
function pickForecastModel(lat, lon) {
  const inAromeItaly = lat >= 36 && lat <= 47.2 && lon >= 6.5 && lon <= 16;
  return inAromeItaly ? "meteofrance_arome_france_hd" : "";
}

const MODEL_LABELS = {
  meteofrance_arome_france_hd:"AROME-HD 1.5km",
  arome_best_max:"AROME-HD + Best (max/h)",
  ens_median_v1:"Ensemble-Median",
};

// Local thermal-wind regime — the dominant afternoon thermal-breeze direction,
// a human label, and its typical peak hour. Geography differs per spot (the
// Gardasee's "Ora" funnels up the lake from the south; a coastal sea breeze
// blows W-SW off the open sea), so the alignment target must be spot-specific
// instead of the old hard-coded 250°.
// Great-circle distance (Haversine, km) — used for the special-spot match radius.
function haversineKm(lat1, lon1, lat2, lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1, Math.sqrt(a)));
}
// Match radius (km) for special-calculation spots: a saved/entered coordinate
// within this distance of the spot centre still triggers the spot-specific
// thermal-regime (and, on the backend, live-station) calculation.
const SPECIAL_RADIUS_KM = 5;
// Lago di Garda: a long lake, kept as a bounding box (Torbole/Riva north end
// down to the south basin) rather than a single 5 km circle, which could not
// cover the whole lake. The point spots below use the SPECIAL_RADIUS_KM circle.
function isGardaSpot(lat, lon){
  return lat>=45.4 && lat<=45.95 && lon>=10.5 && lon<=11.0;
}
// Vasiliki / Ponti bay at the south tip of Lefkada — the famous "Eric" thermal
// funnels in from the WNW (around Cape Doukato), not the open-sea W-SW. Needs
// the synoptic NW (Meltemi) gradient on top of the heating, hence its on/off
// character. Box covers the south-Lefkada corner.
function isVasilikiSpot(lat, lon){
  return haversineKm(lat, lon, 38.6297, 20.6103) <= SPECIAL_RADIUS_KM;
}
// Kathisma / NW coast of Lefkada — open Ionian exposure to the Meltemi (NW).
// No funnel effect; pure synoptic gradient, earlier peak than Vasiliki's Eric.
function isLefkadaNWSpot(lat, lon){
  return haversineKm(lat, lon, 38.7520, 20.5790) <= SPECIAL_RADIUS_KM;
}
// Chioggia / Sottomarina — south end of the Venice Lagoon (Laguna Veneta).
// Dominant thermal wind: Garbìn (SW ~225°) from the Adriatic in summer afternoons.
// Winter: Bora (NE ~40°) dominates synoptically; AROME-HD 1.5km covers the area.
function isChioggiaSpot(lat, lon){
  return haversineKm(lat, lon, 45.2271, 12.3046) <= 8;
}
function thermalRegime(lat, lon){
  // Lago di Garda — afternoon "Ora" comes up the lake from the south.
  if(isGardaSpot(lat,lon))
    return { dir:195, labelKey:"regime_ora", originDE:"vom Gardasee-Süden", originEN:"from the south end of Lake Garda", peakHour:15 };
  // Vasiliki (Lefkada) — cross-shore "Eric" from the WNW, afternoon peak.
  if(isVasilikiSpot(lat,lon))
    return { dir:290, labelKey:"regime_eric", originDE:"um Kap Doukato", originEN:"around Cape Doukato", peakHour:16 };
  // Kathisma / NW Lefkada — direct Meltemi from the NW, afternoon peak.
  if(isLefkadaNWSpot(lat,lon))
    return { dir:315, labelKey:"regime_meltemi", originDE:"vom Ionischen Meer", originEN:"from the Ionian Sea", peakHour:15 };
  // Chioggia / Laguna Veneta — Garbìn (SW) sea breeze off the Adriatic, afternoon peak.
  if(isChioggiaSpot(lat,lon))
    return { dir:225, labelKey:"regime_garbin", originDE:"vom Adriatischen Meer", originEN:"from the Adriatic Sea", peakHour:14 };
  // Generic coastal sea breeze.
  return { dir:250, labelKey:"regime_seabreeze", originDE:"vom Meer", originEN:"from the sea", peakHour:14 };
}
// Helper: get translated label and origin for a regime object
function regimeLabel(regime) { return t(regime.labelKey||"regime_seabreeze"); }
function regimeOrigin(regime) { return lang==="en" ? (regime.originEN||regime.originDE) : regime.originDE; }

function hasWindData(fc){
  return fc && fc.hourly && Array.isArray(fc.hourly.windspeed_10m)
    && fc.hourly.windspeed_10m.some(v => v != null);
}

// Per-hour upper-envelope merge of two forecasts that share the same hourly
// time grid. For each hour keep whichever model reports the stronger wind, and
// carry THAT model's gust + direction so speed/dir stay self-consistent.
// Garda's Pelèr/Ora are channeled valley winds a single grid often under-
// forecasts; the envelope recovers the stronger, more realistic value (AROME
// resolves the morning Pelèr better, best_match/ICON the afternoon Ora peak).
function mergeForecastsMax(a, b){
  if(!hasWindData(a)) return b;
  if(!hasWindData(b)) return a;
  // Both come from forecast_days=7 + timezone=auto, so they start at the same
  // local 00:00; bail out (use a) if the grids don't actually line up.
  if(a.hourly.time?.[0] !== b.hourly.time?.[0]) return a;
  const out = JSON.parse(JSON.stringify(a));
  const ha=a.hourly, hb=b.hourly, ho=out.hourly;
  const n = Math.min(ha.windspeed_10m.length, hb.windspeed_10m.length);
  for(let i=0;i<n;i++){
    const wa=ha.windspeed_10m[i], wb=hb.windspeed_10m[i];
    if(wb!=null && (wa==null || wb>wa)){
      ho.windspeed_10m[i]=wb;
      if(hb.windgusts_10m?.[i]!=null)      ho.windgusts_10m[i]=hb.windgusts_10m[i];
      if(hb.winddirection_10m?.[i]!=null)  ho.winddirection_10m[i]=hb.winddirection_10m[i];
    }
  }
  return out;
}

// ── Pelèr boost (channeled north wind, Lago di Garda) ─────────────────────────
// The Pelèr funnels DOWN the lake from the north (night → forenoon). It is a
// narrow, terrain-channeled jet that even AROME-HD 1.5km systematically under-
// forecasts BOTH in strength AND direction: on 2026-06-23 the measured Torbole
// station ran ~1.4–2× the model and blew steady N (~360°), while the grid put
// the same flow at ~30–100° (E) in the morning and even drew a phantom afternoon
// S-"Ora" that never filled. A narrow north window therefore misses it. At this
// north-end spot the forenoon wind is Pelèr-dominated regardless of the grid's
// exact bearing, so we lift every forenoon hour whose direction is NOT the
// southern Ora sector. Heuristic first pass — should be auto-calibrated against
// the real station feed (/api/station/measured) once enough days are logged.
const PELER = { windFactor:1.40, gustFactor:1.45, oraBearing:195, oraGuard:70, lastHour:12 };
function isPelerHour(hour, dir){
  if(dir==null || hour==null || hour>PELER.lastHour) return false;
  return angDiff(dir, PELER.oraBearing) > PELER.oraGuard; // not within 70° of the S-Ora
}
function applyPelerBoost(fc, lat, lon, mos){
  if(!isGardaSpot(lat,lon) || !hasWindData(fc)) return fc;
  const h=fc.hourly, dirs=h.winddirection_10m||[], times=h.time||[];
  const ens=fc.__ens;
  let boosted=0, anyMosFaded=false;
  for(let i=0;i<h.windspeed_10m.length;i++){
    const hour = times[i] ? parseInt(times[i].slice(11,13),10) : null;
    if(!isPelerHour(hour, dirs[i])) continue;
    // B3-Guard: der 1.40er Pelèr-Faktor ist eine raise-only-Heuristik für genau
    // das, was MOS an dieser Stunde misst. Sobald MOS greift, fährt er gegen
    // 1.00 — sonst zählt der Vormittags-Pelèr am Gardasee doppelt.
    const mh = (mos && mos.hours) ? mos.hours[hour] : null;
    const mw = (mh && mh.n >= MOS_MIN_SAMPLES)
      ? mosWeight(mh.n, mos.station ? mos.station.km : null) : 0;
    const wf = 1 + (PELER.windFactor - 1) * (1 - mw);
    const gf = 1 + (PELER.gustFactor - 1) * (1 - mw);
    if(h.windspeed_10m[i]!=null) h.windspeed_10m[i]=Math.round(h.windspeed_10m[i]*wf*100)/100;
    if(h.windgusts_10m && h.windgusts_10m[i]!=null) h.windgusts_10m[i]=Math.round(h.windgusts_10m[i]*gf*100)/100;
    // Sobald das Ensemble verdrahtet ist, ist ES die angezeigte Windquelle —
    // bliebe es hier unkorrigiert, wäre der Pelèr-Boost am Gardasee durch das
    // Verdrahten still verschwunden. p10/p90 mit anheben, sonst läge die
    // Windlinie ausserhalb ihres eigenen Streuungsbands.
    if(ens){
      for(const k of ["wind","p10","p90"]){
        if(ens[k] && ens[k][i]!=null) ens[k][i]=Math.round(ens[k][i]*wf*100)/100;
      }
      if(ens.spread && ens.spread[i]!=null) ens.spread[i]=Math.round((ens.p90[i]-ens.p10[i])*100)/100;
    }
    boosted++;
    if(mw > 0) anyMosFaded = true;
  }
  if(boosted) fc.__pelerBoost = true;
  if(anyMosFaded) fc.__pelerFaded = true;
  return fc;
}

// ── Meltemi / Eric boost (Lefkada NW + Vasiliki) ──────────────────────────────
// Open-Meteo systematically under-forecasts the Ionian Meltemi at both spots by
// a factor of ~3–4× (grid resolves the synoptic gradient but not the coastal
// acceleration and terrain channeling). LGPZ airport (~28 km, sheltered) itself
// only sees ~55% of Kathisma beach wind. A multiplicative lift comparable to the
// Pelèr is the cleanest fix: ×2.0 for the open NW coast (Kathisma / Lefkada NW),
// ×1.7 for the funnel-in-a-bay geometry at Vasiliki (Eric corridor). Both factors
// fade against MOS weight so that once enough station samples exist the heuristic
// steps back (same B3-guard as Pelèr). Active only during daytime Meltemi window
// (09–21) when wind direction aligns with the spot's regime within ±80°.
const MELTEMI_BOOST = { windFactor: 2.0, gustFactor: 2.1 }; // Kathisma / NW Lefkada
const ERIC_BOOST    = { windFactor: 1.7, gustFactor: 1.8 }; // Vasiliki / Eric
function applyMeltemBoost(fc, lat, lon, mos) {
  const isLeft = isLefkadaNWSpot(lat, lon);
  const isVas  = isVasilikiSpot(lat, lon);
  if ((!isLeft && !isVas) || !hasWindData(fc)) return fc;
  const regime = thermalRegime(lat, lon);
  const cfg    = isLeft ? MELTEMI_BOOST : ERIC_BOOST;
  const h = fc.hourly, dirs = h.winddirection_10m || [], times = h.time || [];
  const ens = fc.__ens;
  const t0Date = times[0] ? times[0].slice(0, 10) : null;
  for (let i = 0; i < h.windspeed_10m.length; i++) {
    const hour = times[i] ? parseInt(times[i].slice(11, 13), 10) : null;
    if (hour == null || hour < 9 || hour > 21) continue;
    const align = dirs[i] != null ? Math.max(0, 1 - angDiff(dirs[i], regime.dir) / 80) : 0;
    if (align < 0.25) continue; // wind not from the Meltemi/Eric sector
    const iDate  = times[i] ? times[i].slice(0, 10) : t0Date;
    const leadDay = (t0Date && iDate)
      ? Math.round((new Date(iDate) - new Date(t0Date)) / 86400000) : 0;
    const leadDamp = MELTEMI_LEAD_DAMP[Math.min(leadDay, 3)];
    const mh = (mos && mos.hours) ? mos.hours[hour] : null;
    const mw = (mh && mh.n >= MOS_MIN_SAMPLES)
      ? mosWeight(mh.n, mos.station ? mos.station.km : null) : 0;
    const wf = 1 + (cfg.windFactor - 1) * (1 - mw) * leadDamp;
    const gf = 1 + (cfg.gustFactor - 1) * (1 - mw) * leadDamp;
    if (h.windspeed_10m[i]  != null) h.windspeed_10m[i]  = Math.round(h.windspeed_10m[i]  * wf * 100) / 100;
    if (h.windgusts_10m && h.windgusts_10m[i] != null)
                                      h.windgusts_10m[i]  = Math.round(h.windgusts_10m[i]  * gf * 100) / 100;
    if (ens) {
      for (const k of ["wind", "p10", "p90"]) {
        if (ens[k] && ens[k][i] != null) ens[k][i] = Math.round(ens[k][i] * wf * 100) / 100;
      }
      if (ens.spread && ens.spread[i] != null)
        ens.spread[i] = Math.round((ens.p90[i] - ens.p10[i]) * 100) / 100;
    }
  }
  fc.__meltemBoost = isLeft ? "Meltemi" : "Eric";
  return fc;
}

// <<live-boost>>
// Live-Station-Nowcast-Boost: hebt HEUTE den vom Modell unterschätzten Wind an
// echten Live-Stationen (z. B. Talamone) an. Nowcast-Anker für aktuelle + nächste
// Stunde(n) direkt an Live verankert (raise-only, böen-bewusst); danach Fenster-Boost
// mit multiplikativem Lift. Non-mutating: liefert eine neue Wind-Kopie.
const LIVE_BOOST_MIN_RATIO   = 1.2;          // Station muss >=20% über Modell liegen
const LIVE_BOOST_KMAX        = 2.0;          // Clamp des Boost-Faktors
const LIVE_BOOST_MIN_MODEL   = 3 / 1.94384;  // Modell-Mindestwind (m/s) für stabiles Verhältnis
const LIVE_BOOST_WIN_START   = 11;           // Thermik-Fenster (lokale Stunde)
const LIVE_BOOST_WIN_END     = 19;
const LIVE_BOOST_ACTIVE_MIN  = 11;           // nur wenn "jetzt" innerhalb der Thermik-Aktivzeit
const LIVE_BOOST_ACTIVE_MAX  = 20;
const LIVE_GUST_BLEND        = 0.5;          // Anteil der Böe im "Jetzt"-Anker (0=nur Grundwind, 1=nur Böe)
const LIVE_ANCHOR_HOURS      = 2;            // aktuelle + (N-1) Folgestunden direkt an Live verankern

// wins/gusts: 24h-Slices (m/s) des Tages. Gibt { wins, gust, k, applied, station, nowKn } zurück.
function applyLiveStationBoost(wins, gust, live, isToday) {
  const none = { wins, gust, k: 1, applied: false, station: null, nowKn: null };
  if (!isToday || !live || !live.ok || live.sensorOk === false || live.wind == null) return none;
  const nowH = live.time ? parseInt(live.time.slice(0,2),10) : new Date().getHours();
  if (!(nowH >= LIVE_BOOST_ACTIVE_MIN && nowH <= LIVE_BOOST_ACTIVE_MAX)) return none;
  const modelNow = wins[nowH];
  if (modelNow == null || modelNow < LIVE_BOOST_MIN_MODEL) return none;

  // Böen-bewusster "Jetzt"-Wind: Grundwind + Anteil Richtung jüngster Spitzenböe.
  const gustMs  = (live.gustMax != null ? live.gustMax
                 : live.gust != null ? live.gust : live.wind);
  const effLive = live.wind + LIVE_GUST_BLEND * Math.max(0, gustMs - live.wind);

  const bw = wins.slice(), bg = gust ? gust.slice() : gust;
  let applied = false;

  // (1) Direkter Nowcast-Anker für aktuelle + nächste Stunde(n) — Realität gewinnt
  //     jetzt, RAISE-ONLY (nie einen guten Forecast kappen), böen-bewusst.
  for (let h = nowH; h < nowH + LIVE_ANCHOR_HOURS && h <= 23; h++) {
    if (bw[h] != null && effLive > bw[h]) { bw[h] = Math.round(effLive * 100) / 100; applied = true; }
    if (bg && gustMs != null && (bg[h] == null || gustMs > bg[h])) bg[h] = Math.round(gustMs * 100) / 100;
  }

  // (2) Fenster-weiter multiplikativer Lift für den Rest des Thermikfensters,
  //     verankert am GRUNDWIND-Verhältnis (konservativ, keine Böen-Extrapolation).
  let k = live.wind / modelNow;
  if (k >= LIVE_BOOST_MIN_RATIO) {
    k = Math.min(k, LIVE_BOOST_KMAX);
    for (let h = LIVE_BOOST_WIN_START; h <= LIVE_BOOST_WIN_END; h++) {
      if (h >= nowH && h < nowH + LIVE_ANCHOR_HOURS) continue; // schon verankert
      if (bw[h] != null) { const v = Math.round(bw[h] * k * 100) / 100; if (v > bw[h]) { bw[h] = v; applied = true; } }
      if (bg && bg[h] != null) { const v = Math.round(bg[h] * k * 100) / 100; if (v > bg[h]) bg[h] = v; }
    }
  } else { k = 1; }

  return applied
    ? { wins: bw, gust: bg, k: Math.round(k * 100) / 100, applied: true,
        station: live.label || live.key || "Live-Station",
        nowKn: Math.round(msToKn(effLive) * 10) / 10 }
    : none;
}
// <</live-boost>>

// <<measured-correction>>
// Distanzgewichtete, RAISE-ONLY Pro-Stunde-Korrektur des Tages-Winds an der
// echten Messreihe (measured-Station). Nahe Station = starkes Gewicht, ferne =
// schwach (Proxy). Non-mutating; nur wo die Station mehr misst als das Modell.
const STATION_TRUST_AT_SPOT = 0.8;   // Blend-Gewicht bei ~0 km Entfernung
const STATION_MAX_KM        = 50;    // ab hier kein Vertrauen mehr (Gewicht 0)
function measuredWeight(km) {
  if (km == null) return STATION_TRUST_AT_SPOT;
  return Math.max(0, STATION_TRUST_AT_SPOT * (1 - Math.min(km, STATION_MAX_KM) / STATION_MAX_KM));
}
// wins/gust: 24h-Slices (m/s) des ANGEZEIGTEN Tages. measured: State-Objekt vom
// /api/station/measured-Feed. activeDateStr: 'YYYY-MM-DD' des angezeigten Tages.
function applyMeasuredStationCorrection(wins, gust, measured, activeDateStr) {
  const none = { wins, gust, applied: false, station: null, km: null, weight: 0 };
  if (!measured || !measured.ok || !measured.hourly || measured.date !== activeDateStr) return none;
  const mw = measured.hourly.wind || [], mg = measured.hourly.gust || [];
  const w = measuredWeight(measured.km);
  if (w <= 0) return none;
  const bw = wins.slice(), bg = gust ? gust.slice() : gust;
  let applied = false;
  for (let h = 0; h < bw.length; h++) {
    if (mw[h] != null && bw[h] != null && mw[h] > bw[h]) {
      bw[h] = Math.round((bw[h] + (mw[h] - bw[h]) * w) * 100) / 100; applied = true;
    }
    if (bg && mg[h] != null && bg[h] != null && mg[h] > bg[h]) {
      bg[h] = Math.round((bg[h] + (mg[h] - bg[h]) * w) * 100) / 100;
    }
  }
  return applied
    ? { wins: bw, gust: bg, applied: true, station: measured.label || measured.source || "Station",
        km: measured.km ?? null, weight: Math.round(w * 100) / 100 }
    : none;
}
// <</measured-correction>>

// <<ensemble>>
// Ensemble-Median statt Einzelmodell.
//
// Warum: an Lefkada spannen die Modelle für denselben Nachmittag 2.99–5.41 m/s
// auf (81 % Spannweite). Die App zeigte bisher icon_eu — im unteren Drittel.
// Das ist die Ursache des wiederkehrenden "Forecast zu niedrig", nicht die
// Thermik-Formel. (AROME deckt Lefkada gar nicht ab; best_match fällt dort auf
// ICON-EU 7 km zurück.)
//
// Median, nicht Mittel: ein Mittel wird vom GFS-Ausreißer hochgezogen und
// springt, sobald ein Member aus der Domain fällt. Die MOS-Bias-Korrektur lernt
// später das Residuum gegen genau diese Größe — ein bewegliches Ziel wäre nicht
// lernbar. Gewichte wären mangels Verifikationsdaten geraten und nur als
// "gelernt" etikettierte Heuristik.
//
// NUR Windgeschwindigkeit. Richtung bräuchte einen zirkulären Median (0/360-Wrap);
// seaBreeze und computeThermik hängen beide an der Richtung, ein naiver Median
// dort erzeugt Alignment-Fehler statt sie zu vermeiden. Richtung, Böen, CAPE und
// Lifted Index bleiben vom Trägermodell.
const ENS_CORE = ["ecmwf_ifs025","ecmwf_aifs025_single","icon_eu","icon_global","gfs_seamless"];
const ENS_MIN_MEMBERS  = 3;    // pro STUNDE; darunter ist ein Median nicht aussagekräftig
const ENS_LONG_RANGE   = 0.8;  // ab dieser Abdeckung gilt ein Member als durchgehend

const ensR2 = v => (v == null || !Number.isFinite(v)) ? null : Math.round(v * 100) / 100;

// best_match wird NIE aufgenommen: es aliast je nach Region auf icon_eu oder gfs
// und würde dasselbe Modell zweimal in den Median stimmen lassen.
function ensembleMembers(lat, lon) {
  const hi = pickForecastModel(lat, lon);
  return hi ? [hi, ...ENS_CORE] : ENS_CORE.slice();
}

// Open-Meteo liefert Member als `windspeed_10m_<model>`. Modelle außerhalb ihrer
// räumlichen Domain fehlen KOMPLETT — kein null-gefülltes Array, der Key
// existiert einfach nicht (verifiziert: AROME an Lefkada).
//
// Abdeckung wird hier NICHT global geprüft. Die Modelle haben sehr
// unterschiedliche Vorhersagelängen: AROME ~48 h, ICON-EU ~120 h, IFS/GFS 168 h.
// Eine globale Schwelle über das 7-Tage-Fenster würde AROME (29 %) und ICON-EU
// (71 %) rauswerfen — also ausgerechnet die hochauflösenden Modelle, die für
// Tag 1–2 am meisten wert sind. Zugelassen wird deshalb jeder Member mit
// mindestens einem verwertbaren Wert; welche Member eine konkrete Stunde tragen,
// entscheidet combineEnsemble pro Stunde.
function admitMembers(hourly, members, n) {
  const out = [];
  for (const m of members) {
    const arr = hourly?.[`windspeed_10m_${m}`];
    if (!Array.isArray(arr) || arr.length < n) continue;
    let ok = 0;
    for (let i = 0; i < n; i++) if (Number.isFinite(arr[i])) ok++;
    if (ok > 0) out.push({ model: m, arr, coverage: ok / n });
  }
  return out;
}

// Lineare Interpolation zwischen Rängen. Bei 5–6 Membern liegt p10 sonst immer
// exakt auf dem Minimum und p90 auf dem Maximum — das Streuungsband wäre dann
// nur "min bis max" und ein einzelner Ausreißer würde es allein aufspannen.
function quantile(values, q) {
  const a = values.slice().sort((x, y) => x - y);
  if (!a.length) return null;
  const pos = (a.length - 1) * q;
  const lo = Math.floor(pos), hi = Math.ceil(pos);
  return lo === hi ? a[lo] : a[lo] + (a[hi] - a[lo]) * (pos - lo);
}
const median = arr => quantile(arr, 0.5);

// → {wind,p10,p90,spread,nMembers,members,membersLong,n} | null
//
// Einzelne Stunden können null sein (zu wenige Member zu DIESER Stunde). Der
// Aufrufer muss dort auf den Trägerwind zurückfallen — combineEnsemble erfindet
// keinen Wert, wo keiner gerechnet wurde.
//
// Die Member-Zusammensetzung ändert sich über den Horizont: Tag 1 trägt AROME
// mit, ab ~Tag 5 nur noch IFS/AIFS/GFS/ICON-global. Das ist gewollt und ehrlich —
// `nMembers[i]` macht es sichtbar, und die Streuung wächst dort ohnehin.
function combineEnsemble(hourly, members) {
  const n = hourly?.time?.length || 0;
  if (!n) return null;
  const adm = admitMembers(hourly, members, n);
  if (adm.length < ENS_MIN_MEMBERS) return null;
  const wind = new Array(n).fill(null), p10 = new Array(n).fill(null),
        p90  = new Array(n).fill(null), spread = new Array(n).fill(null),
        nMembers = new Array(n).fill(0);
  for (let i = 0; i < n; i++) {
    const v = [];
    for (const m of adm) if (Number.isFinite(m.arr[i])) v.push(m.arr[i]);
    nMembers[i] = v.length;
    if (v.length < ENS_MIN_MEMBERS) continue;
    wind[i]   = ensR2(quantile(v, 0.50));
    p10[i]    = ensR2(quantile(v, 0.10));
    p90[i]    = ensR2(quantile(v, 0.90));
    spread[i] = ensR2(p90[i] - p10[i]);
  }
  return {
    wind, p10, p90, spread, nMembers, n,
    members: adm.map(m => m.model),
    membersLong: adm.filter(m => m.coverage >= ENS_LONG_RANGE).map(m => m.model),
  };
}

// Böen kommen vom Trägermodell, der Wind vom Ensemble. Weichen beide auseinander,
// entstehen wind > gust-Lücken — und die "Böen deutlich über Wind"-Warnung
// (midG - effW > 4) feuert grundlos. Also die Böe im selben Verhältnis mitziehen,
// gedeckelt, damit ein Trägerwind nahe null den Faktor nicht explodieren lässt.
const GUST_K_MIN = 0.75, GUST_K_MAX = 1.35, GUST_CARRIER_FLOOR_MS = 1.0;
function rescaleGusts(gust, carrierWind, ensWind) {
  if (!Array.isArray(gust)) return gust;
  return gust.map((g, i) => {
    const c = carrierWind?.[i], e = ensWind?.[i];
    if (!Number.isFinite(g) || !Number.isFinite(c) || !Number.isFinite(e)) return g;
    if (c < GUST_CARRIER_FLOOR_MS) return g;
    return ensR2(g * Math.min(GUST_K_MAX, Math.max(GUST_K_MIN, e / c)));
  });
}

// Ensemble und Trägermodell müssen auf DERSELBEN Zeitachse liegen — beide Calls
// gehen getrennt raus und können unterschiedliche timezone/Startstunde liefern.
// Passt das nicht, wird das Ensemble komplett verworfen statt stundenweise
// verschoben verrechnet (Muster von mergeForecastsMax).
function ensembleGridMatches(fcHourly, ensHourly) {
  const a = fcHourly?.time, b = ensHourly?.time;
  return !!(Array.isArray(a) && Array.isArray(b) && a.length && a.length === b.length && a[0] === b[0]);
}
// <</ensemble>>

// <<thermal-correction>>
// Genau EINE Thermik-Korrektur je Stunde: entweder gelernt (MOS) oder
// modelliert (seaBreeze) oder ein Übergang — aber NIE beides addiert.
//
// Warum das arithmetisch gesperrt sein muss und nicht per Tuning: der MOS-Bias
// ist als median(obs − ensembleMedian_raw) definiert. Alles, was seaBreeze()
// modelliert, steckt da bereits drin — es wurde ja mitgemessen. Beides zu
// addieren stapelt zuverlässig +3.5 auf +3.0. Eine Konvexkombination kann per
// Konstruktion nicht über max(a,b) hinaus, egal wie die Gewichte stehen.
const MOS_MIN_SAMPLES = 8;   // Spiegelt den Serverwert; darunter zählt MOS nicht
const MOS_W_K         = 8;   // Übergabe-Dämpfung. NICHT 15 — sonst wird MOS nie wirksam
// Lead-day-Dämpfung: MOS wurde auf t+0-Daten gelernt; für t+1/t+2 schlägt der
// Bias-Charakter um. Konservative Abnahme bis 40 % bei t+3+.
const MOS_LEAD_DAMP   = [1.00, 0.75, 0.55, 0.40];
// Meltemi-Boost-Dämpfung: synoptische Meltemi-Systeme sind 48 h vorher sichtbar,
// aber das Modell trifft Stärke und Timing besser als bei t+0. Daher sanftere
// Dämpfung als MOS — aber das Modell braucht weniger "Hilfe" für t+2.
const MELTEMI_LEAD_DAMP = [1.00, 0.80, 0.62, 0.48];
const clamp01 = v => Math.max(0, Math.min(1, v));

// Zwei Dämpfungen, die sich multiplizieren, und das ist Absicht:
//   Server, n/(n+10):  schützt den WERT      — wenig Daten ⇒ Bias gegen 0
//   hier,   n/(n+8):   steuert die ÜBERGABE  — plus Distanz zur Station
// Bei n=13 und km=0 ergibt das 0.62; zusammen mit dem Server 0.57 × 0.62 ≈ 0.35.
// Wer einen der beiden Faktoren ändert, muss den anderen kennen.
function mosWeight(n, km) {
  if (!n || n < MOS_MIN_SAMPLES) return 0;
  return clamp01((n / (n + MOS_W_K)) * (measuredWeight(km) / STATION_TRUST_AT_SPOT));
}

// mos: Antwort von /api/station/mos oder null.
// leadDay: 0=heute, 1=morgen, 2=übermorgen — dämpft die MOS-Korrektur, weil der
// gelernte Bias ein t+0-Bias ist und mit der Vorlaufzeit schlechter passt.
// sb wird IMMER mitgeliefert — die UI liest dayData.sb an zwei Stellen.
function thermalCorrection(hour, dir, month, regime, mos, leadDay = 0) {
  const sb  = seaBreeze(dir, hour, month, regime);
  const sbB = sb.active ? sb.boost : 0;
  const m   = (mos && mos.hours) ? mos.hours[hour] : null;
  // Neuronaler Bias je nach Vorlaufzeit (lead=0 heute, lead=24 morgen, lead=48 übermorgen)
  const neuralBias = m
    ? (leadDay >= 2 ? m.neuralBiasMs48 : leadDay >= 1 ? m.neuralBiasMs24 : m.neuralBiasMs) ?? null
    : null;
  const linearBias = (m && m.n >= MOS_MIN_SAMPLES) ? m.biasShrunkMs : null;
  const bias = neuralBias ?? linearBias;
  const leadDamp = MOS_LEAD_DAMP[Math.min(leadDay, 3)];
  const w    = bias != null ? mosWeight(m.n, mos.station ? mos.station.km : null) * leadDamp : 0;
  if (w <= 0) return { addMs: sbB, source: "seabreeze", mosWeight: 0, n: m ? m.n : 0, sb, leadDay };
  const source = neuralBias != null ? (w >= 0.85 ? "neural_mos" : "neural_blend")
                                    : (w >= 0.85 ? "mos" : "blend");
  return {
    addMs: Math.round((w * bias + (1 - w) * sbB) * 100) / 100,
    source, mosWeight: w, n: m.n, sb, leadDay,
  };
}
// <</thermal-correction>>

async function tryFetchForecast(lat, lon) {
  const base = {
    latitude:lat, longitude:lon,
    hourly:"temperature_2m,windspeed_10m,windgusts_10m,winddirection_10m,surface_pressure,relativehumidity_2m,cloudcover,cape,lifted_index",
    wind_speed_unit:"ms", forecast_days:7, timezone:"auto",
  };
  const fetchModel = (models) => {
    const p = new URLSearchParams(models ? { ...base, models } : base);
    return fetchWithTimeout(`https://api.open-meteo.com/v1/forecast?${p}`);
  };
  const model = pickForecastModel(lat, lon);
  if (model) {
    try {
      // Fetch the high-res model AND the global best_match in parallel, then
      // take the per-hour stronger wind. A single grid (even AROME 1.5km)
      // under-forecasts the channeled Gardasee winds; the envelope is closer
      // to reality, especially the afternoon Ora peak.
      const [arome, best] = await Promise.all([
        fetchModel(model).catch(()=>null),
        fetchModel("").catch(()=>null),
      ]);
      if (hasWindData(arome) && hasWindData(best)) {
        const merged = mergeForecastsMax(arome, best);
        merged.__model = "arome_best_max";
        return merged;
      }
      // AROME's grid ends near lon 16 — if this point is outside it (all-null
      // winds) silently fall through to whichever model has data.
      if (hasWindData(arome)) { arome.__model = model; return arome; }
      if (hasWindData(best))  { best.__model = "best_match"; return best; }
    } catch(_) { /* fall back to best_match below */ }
  }
  const fc = await fetchModel("");
  fc.__model = "best_match";
  return fc;
}

// Zweiter, schlanker Call NEBEN tryFetchForecast. Das Trägermodell bleibt
// unverändert und liefert weiterhin Richtung, Böen, CAPE, Lifted Index und
// Druck — hier wird ausschliesslich windspeed_10m je Member geholt.
//
// Gemessen bei forecast_days=7: Trägermodell 11.1 KB, dieser Call 11.6 KB,
// ein "fettes" Ensemble mit allen neun Variablen dagegen 42.3 KB. Der schlanke
// Zuschnitt macht ausserdem strukturell unmöglich, dass jemand später Böen aus
// dem Ensemble erwartet — zwei der Modelle (AIFS, IFS025) rechnen gar keine.
async function tryFetchEnsemble(lat, lon) {
  const members = ensembleMembers(lat, lon);
  const p = new URLSearchParams({
    latitude: lat, longitude: lon, hourly: "windspeed_10m",
    wind_speed_unit: "ms", forecast_days: 7, timezone: "auto",
    models: members.join(","),
  });
  const j = await fetchWithTimeout(`https://api.open-meteo.com/v1/forecast?${p}`);
  return { hourly: j?.hourly, ens: combineEnsemble(j?.hourly, members) };
}

// Hängt das Ensemble ans Trägerobjekt — aber nur, wenn beide auf derselben
// Zeitachse liegen. Beide Calls gehen getrennt raus (eigenes timezone=auto,
// eigener Modellauf); bei Versatz wird das Ensemble komplett verworfen statt
// stundenweise verschoben verrechnet. Ein fehlendes Ensemble ist nie fatal —
// die App rechnet dann wie vorher mit dem Trägermodell.
function attachEnsemble(fc, res) {
  if (!fc || !res?.ens) return fc;
  if (!ensembleGridMatches(fc.hourly, res.hourly)) { fc.__ensRejected = "grid_mismatch"; return fc; }
  fc.__ens = res.ens;
  fc.__carrierModel = fc.__model;   // Quelle für Böen/CAPE/Richtung, fürs Badge
  fc.__model = "ens_median_v1";
  return fc;
}

async function tryFetchHistorical(lat, lon) {
  // Use local date to avoid UTC-vs-local day mismatch
  const now = new Date();
  const localDateStr = d => {
    const y=d.getFullYear(), mo=String(d.getMonth()+1).padStart(2,'0'), dy=String(d.getDate()).padStart(2,'0');
    return `${y}-${mo}-${dy}`;
  };
  const end = new Date(now); end.setDate(now.getDate()-1);
  const start = new Date(now); start.setDate(now.getDate()-8);
  const fmt = localDateStr;
  const params = new URLSearchParams({
    latitude:lat, longitude:lon,
    start_date:fmt(start), end_date:fmt(end),
    hourly:"windspeed_10m,temperature_2m",
    wind_speed_unit:"ms", timezone:"auto",
  });
  return fetchWithTimeout(`https://archive-api.open-meteo.com/v1/archive?${params}`, 8000);
}

// ── Thermik ───────────────────────────────────────────────────────────────────
// Smallest angle between two compass bearings (0–180°).
function angDiff(a, b){ let d=Math.abs(a-b)%360; return d>180?360-d:d; }

function computeThermik(h, idx, regime) {
  const cape=(h.cape?.[idx]??0), li=(h.lifted_index?.[idx]??0), temp=(h.temperature_2m?.[idx]??20);
  const cloud=(h.cloudcover?.[idx]??50), humid=(h.relativehumidity_2m?.[idx]??60);
  const hour = h.time?.[idx] ? parseInt(h.time[idx].slice(11,13),10) : 12;
  const solar = Math.max(0, Math.sin(Math.PI*(hour-6)/12));
  const capePts = Math.min(40,(cape/3000)*40);
  const liPts = li<0 ? Math.min(30,Math.abs(li)*5) : li>2 ? -10 : 0;
  const tempPts = Math.max(0,(temp-20)*1.5);
  const cloudF = 1-(cloud/100)*0.6;
  const humidF = Math.max(0.4,1-((humid-40)/120));
  // Thermal lake/valley breeze (Ora etc.): a sun-driven wind that does NOT
  // register in CAPE/lifted-index. When the afternoon wind aligns with the
  // spot's thermal regime, credit it so a pumping Ora day no longer reads
  // "Kaum Thermik".
  let breezePts = 0;
  if(regime && hour>=11 && hour<=18){
    const dir=h.winddirection_10m?.[idx];
    if(dir!=null) breezePts = Math.max(0,1-angDiff(dir,regime.dir)/60)*solar*25;
  }
  return Math.round(Math.max(0,Math.min(100,(capePts+liPts+tempPts)*solar*cloudF*humidF+breezePts)));
}

function classifyThermik(max) {
  if(max<10) return{icon:"😴",labelKey:"th_none",descKey:"th_none_desc",color:C.go};
  if(max<30) return{icon:"🌤",labelKey:"th_light",descKey:"th_light_desc",color:C.caution};
  if(max<60) return{icon:"⛅",labelKey:"th_moderate",descKey:"th_moderate_desc",color:C.caution};
  return{icon:"⛈",labelKey:"th_strong",descKey:"th_strong_desc",color:C.stop};
}
// Resolve translated label/desc from classifyThermik result
function thermikLabel(info) { return t(info.labelKey); }
function thermikDesc(info) { return t(info.descKey); }

function seaBreeze(windDir, hour, month, regime) {
  if(hour<10||hour>19) return{active:false,boost:0,align:0};
  // Align against the spot's thermal-breeze direction (Garda Ora ~195°, coastal
  // sea breeze 250°), wrap-around safe so e.g. 198° still matches a 195° target.
  const target = regime?.dir ?? 250;
  const align=Math.max(0,1-angDiff(windDir,target)/80);
  const season=[0,.4,.5,.7,.9,1,1,1,.8,.6,.4,.2,.3][month]??0.5;
  const hf=Math.sin(Math.PI*(hour-10)/9);
  const boost=align*season*hf*3.5;
  return{active:align>0.25,boost:Math.round(boost*10)/10,align};
}

// <<wing-scoring>>
// ── FoilScore ─────────────────────────────────────────────────────────────────
const REF_FOIL_TERM = 0.8;   // = altes foilF*0.8 bei Referenz-Foil 1800 cm²
function calcWindow(weight, wingM2, skill, knownPlaneMs) {   // foilCm2 ENTFERNT
  const sMin = {beginner:1.50,intermediate:1.25,advanced:1.00,pro:0.85}[skill]??1.15;
  const sOpt = {beginner:1.60,intermediate:2.00,advanced:2.60,pro:3.20}[skill]??2.00;
  const sMax = {beginner:2.00,intermediate:2.60,advanced:3.50,pro:4.50}[skill]??2.60;
  let minW;
  if (knownPlaneMs && knownPlaneMs > 0) {
    minW = knownPlaneMs;
  } else {
    const load = weight / wingM2;
    minW = Math.max(2.5, (3.5 + load*0.15 + REF_FOIL_TERM) * sMin * 0.85);
  }
  return { minWind:Math.round(minW*10)/10,
           optMin: Math.round(minW*1.2*10)/10,
           optMax: Math.round(minW*sOpt*10)/10,
           maxWind:Math.round(minW*sMax*10)/10 };
}
// ── Wing manufacturer windrange tables (extensible) ──────────────────────────
// Per Marke/Modell: Hersteller-Windrange (kn) + Wing-Masse (kg) je Größe (m²).
// Die Ranges gelten für ein Referenzgewicht; das echte Gewicht skaliert sie
// (√-Gesetz). Aktuell wird die Default-Tabelle global angewandt (noch kein
// Per-User-Marken-Matching — Datenstruktur ist dafür vorbereitet).
const WING_BRANDS = {
  "Harlem Pace": {
    refWeightKg: 78,
    sizes: {
      3: { rangeKn: [20, 32], wingKg: 1.76 },
      4: { rangeKn: [16, 28], wingKg: 2.12 },
      5: { rangeKn: [14, 26], wingKg: 2.32 },
      6: { rangeKn: [10, 22], wingKg: 2.77 },
    },
  },
};
const DEFAULT_WING_BRAND = "Harlem Pace";
const TABLE_BLEND = 0.5;        // Gewicht der Tabelle vs. Physikmodell im Blend
const FEEDBACK_BLEND = 0.5;     // Gewicht der Spot/Wing-Range-Kalibrierung
const FEEDBACK_MIN_SAMPLES = 1; // ab so vielen Samples greift die Kalibrierung
// Hersteller-Windfenster für eine Wing-Größe: linear zwischen den Tabellenstufen
// interpoliert und aufs Fahrergewicht reskaliert (√-Gesetz: wind ∝ √(gewicht/ref)).
// Gibt {outOfRange:true, reason} zurück, wenn die Größe außerhalb der Tabelle
// liegt — KEINE stille Extrapolation über 3–6 m² hinaus.
function wingTableWindow(weight, wingM2, brandKey = DEFAULT_WING_BRAND) {
  const brand = WING_BRANDS[brandKey];
  if (!brand) return null;
  const stops = Object.keys(brand.sizes).map(Number).sort((a,b)=>a-b);
  const lo = stops[0], hi = stops[stops.length-1];
  if (wingM2 < lo || wingM2 > hi) {
    return { outOfRange: true,
             reason: `Wing ${wingM2} m² außerhalb Herstellerangabe (${lo}–${hi} m²)` };
  }
  let a = lo, b = hi;
  for (let i = 0; i < stops.length - 1; i++) {
    if (wingM2 >= stops[i] && wingM2 <= stops[i+1]) { a = stops[i]; b = stops[i+1]; break; }
  }
  const ra = brand.sizes[a].rangeKn, rb = brand.sizes[b].rangeKn;
  const t = (a === b) ? 0 : (wingM2 - a) / (b - a);
  const minKn = ra[0] + (rb[0] - ra[0]) * t;
  const maxKn = ra[1] + (rb[1] - ra[1]) * t;
  const f = Math.sqrt(weight / brand.refWeightKg);
  const minMs = knToMs(minKn * f), maxMs = knToMs(maxKn * f);
  // Hersteller nennt nur die Außenränge; das Optimalband wird in die obere Mitte
  // gelegt (Foil-Wings tragen mittig-oben am besten). Heuristik, dokumentiert.
  return {
    minWind: Math.round(minMs * 10) / 10,
    optMin:  Math.round((minMs + 0.25 * (maxMs - minMs)) * 10) / 10,
    optMax:  Math.round((minMs + 0.75 * (maxMs - minMs)) * 10) / 10,
    maxWind: Math.round(maxMs * 10) / 10,
    outOfRange: false,
  };
}
// Fenster {min,opt,opt,max} aus einer erlebten kn-Range (opt-Band 25/75 wie Tabelle).
function rangeToWindow(minKn, maxKn) {
  const lo=knToMs(minKn), hi=knToMs(maxKn);
  return { minWind:Math.round(lo*10)/10,
           optMin:Math.round((lo+0.25*(hi-lo))*10)/10,
           optMax:Math.round((lo+0.75*(hi-lo))*10)/10,
           maxWind:Math.round(hi*10)/10 };
}
function blendWindows(a, b, w) {   // kantenweise, p=1-w
  const p=1-w;
  return { minWind:Math.round((p*a.minWind+w*b.minWind)*10)/10,
           optMin :Math.round((p*a.optMin +w*b.optMin )*10)/10,
           optMax :Math.round((p*a.optMax +w*b.optMax )*10)/10,
           maxWind:Math.round((p*a.maxWind+w*b.maxWind)*10)/10 };
}
// EINZIGE kanonische Scoring-Quelle: Physikmodell, geblendet mit der
// Herstellertabelle, wenn die Wing-Größe abgedeckt ist. Überall konsumiert
// (Chart, Tages-Scores, pickBestSetup).
function wingWindow(weight, wingM2, skill, knownPlaneMs,
                    brandKey = DEFAULT_WING_BRAND, spotWingRange = null) {
  const phys = calcWindow(weight, wingM2, skill, knownPlaneMs);   // kein foil mehr
  // Fahrer-kalibrierte Planing-Schwelle = Ground Truth → nie verwässern.
  if (knownPlaneMs && knownPlaneMs > 0) return phys;
  const tab = wingTableWindow(weight, wingM2, brandKey);
  let base = (!tab || tab.outOfRange) ? phys : blendWindows(phys, tab, TABLE_BLEND);
  // NEU: Feedback-Layer — nur wenn genug Samples UND beide Range-Enden vorhanden.
  if (spotWingRange && spotWingRange.samples >= FEEDBACK_MIN_SAMPLES
      && spotWingRange.minKn != null && spotWingRange.maxKn != null) {
    const fb = rangeToWindow(spotWingRange.minKn, spotWingRange.maxKn);
    return blendWindows(base, fb, FEEDBACK_BLEND);
  }
  return base;
}
function scoreHour(w,win) {
  if(w<win.minWind) return Math.max(0,Math.round((w/win.minWind)*45));
  if(w<win.optMin) return Math.round(55+((w-win.minWind)/(win.optMin-win.minWind))*30); // "fahrbar aber zäh" 55→85
  if(w<=win.optMax) return 100;
  if(w<=win.maxWind) return Math.round(100-((w-win.optMax)/(win.maxWind-win.optMax))*50);
  return Math.max(0,Math.round(50-(w-win.maxWind)*10));
}
function scoreDay(winds,win,start=0) {
  // Tages-Score = bestes zusammenhängendes 4h-Fenster zwischen 9 und 19 Uhr.
  // Schwache Vormittage drücken den Score nicht mehr; es zählt die beste Session.
  return bestSession(winds,win,start).score;
}
// Findet das beste 4h-Fenster (Score + Start/Endstunde) für den Tag
function bestSession(winds,win,start=0) {
  let best={score:0,startHour:null,endHour:null};
  for(let s=9;s<=15;s++){
    const hrs=[];
    for(let h=s;h<s+4;h++){ const v=winds[start+h]; if(v!==undefined) hrs.push(scoreHour(v,win)); }
    if(!hrs.length) continue;
    const avg=Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length);
    if(avg>best.score) best={score:avg,startHour:s,endHour:s+4};
  }
  return best;
}

// ── Equipment selection v2.2.0 ────────────────────────────────────────────────
// Given the rider's gear list and the day's representative wind (m/s),
// pick the BEST setup: the one whose window scores highest for that wind.
// Tie-break: prefer the setup whose optimal range is most centered on the wind.
function pickBestSetup(gearList, weight, skill, windMs, wingRanges=null) {
  if(!gearList || !gearList.length) return null;
  let best = null;
  for(const g of gearList){
    const plane = g.planeKn ? (parseFloat(g.planeKn)/1.94384) : null;
    const swr = wingRanges ? wingRanges[String(parseFloat(g.wing))] : null;
    const win = wingWindow(weight, parseFloat(g.wing), skill, plane, DEFAULT_WING_BRAND, swr); // foil raus
    const sc = scoreHour(windMs, win);
    // centeredness: how close wind is to the middle of the optimal band
    const mid = (win.optMin + win.optMax) / 2;
    const center = 1 - Math.min(1, Math.abs(windMs - mid) / (win.optMax - win.optMin + 0.01));
    const rank = sc * 100 + center * 10;
    if(!best || rank > best.rank){
      best = { gear:g, win, score:sc, rank };
    }
  }
  return best;
}
// <</wing-scoring>>

// localStorage helpers (safe — no crash if storage unavailable, e.g. in preview)
function loadStored(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e) { return fallback; }
}
function saveStored(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e) { return false; }
}
// Persist a setting to localStorage AND the per-user server store. iOS Safari
// drops localStorage (Private Browsing / "Block All Cookies" / ITP), so the
// server copy is the durable one; the local write is just an offline cache.
// Fire-and-forget — the UI already updated from React state.
function savePref(key, val) {
  saveStored(key, val);
  fetch(`/api/prefs/${key}`, {
    method: "PUT", credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ value: val }),
  }).catch(()=>{});
}

async function fetchStationCurrent(lat, lon) {

    if(!r.ok) throw new Error(`Proxy ${r.status}`);

}
// Station-vs-model wind bias over an overlapping window (Meteostat history vs
// Open-Meteo archive, both m/s). Replaces the Weatherbit history that the plan
// never returned. First (uncached) call downloads a bulk file → generous timeout.
async function fetchStationBias(lat, lon) {

    if(!r.ok) throw new Error(`Proxy ${r.status}`);
    return r.json();
  } catch(e) { return { ok:false, error:e.message }; }
}
// Gelernte Stunden-Bias-Korrektur (MOS): wie weit der Ensemble-Median an dieser
// Station je LOKALER Stunde systematisch neben der Beobachtung liegt.
// Nicht zu verwechseln mit fetchStationBias() darüber — das ist ein EINZELNER
// Mittelwert-Bias einer Meteostat-Station gegen das Archiv und speist nur den
// Konfidenz-Score. Das hier ist vorzeichenbehaftet, stundenaufgelöst und wird auf
// den Wind angewendet. Antwortet rauschfrei mit ok:false, wo es keine Station
// oder noch keine gelernten Daten gibt.
async function fetchStationMos(lat, lon) {
  try {
    const r = await fetch(`${PROXY_BASE}/mos?lat=${lat}&lon=${lon}`, { signal: AbortSignal.timeout(8000) });
    if(!r.ok) throw new Error(`Proxy ${r.status}`);
    return r.json();
  } catch(e) { return { ok:false, error:e.message }; }
}

function computeConfidence({ stationCurrent, modelCurrentWind, modelCurrentDir, stationHistMeanWind, modelHistMeanWind, ensSpreadMs }) {
  const parts=[], notes=[];
  if(stationCurrent && stationCurrent.ok && modelCurrentWind!=null && stationCurrent.wind!=null){
    const errMs=Math.abs(stationCurrent.wind-modelCurrentWind);
    parts.push({w:0.45,v:Math.max(0,100-(errMs/6)*100)});
    notes.push(`Wind-Δ aktuell ${errMs.toFixed(1)} m/s`);
  }
  if(stationCurrent && stationCurrent.ok && modelCurrentDir!=null && stationCurrent.dir!=null){
    let dd=Math.abs(stationCurrent.dir-modelCurrentDir)%360; if(dd>180) dd=360-dd;
    parts.push({w:0.20,v:Math.max(0,100-(dd/90)*100)});
    notes.push(`Richtungs-Δ ${Math.round(dd)}°`);
  }
  if(stationHistMeanWind!=null && modelHistMeanWind!=null){
    const bias=Math.abs(stationHistMeanWind-modelHistMeanWind);
    parts.push({w:0.35,v:Math.max(0,100-(bias/4)*100)});
    notes.push(`Hist. Bias ${bias.toFixed(1)} m/s`);
  }
  // ACHTUNG, kein Tippfehler: w:1 gegenüber 0.45/0.20/0.35 (Summe 1.0) ist Absicht.
  // Der Part verdoppelt die Gewichtssumme und halbiert damit das Gewicht ALLER
  // Stations-Parts — die Modell-Streuung soll den Score kräftig Richtung 50 ziehen,
  // wenn die Modelle sich uneinig sind. Nicht "korrigieren".
  if(ensSpreadMs!=null){
    parts.push({w:1,v:Math.max(0,100-(ensSpreadMs/4)*100)});
    notes.push(`Modell-Streuung ${ensSpreadMs.toFixed(1)} m/s`);
  }
  if(!parts.length) return { confidence:null, notes:[t('no_station_compare')] };
  const wsum=parts.reduce((a,p)=>a+p.w,0);
  return { confidence: Math.round(parts.reduce((a,p)=>a+p.v*p.w,0)/wsum), notes };
}

function applyConfidence(rawScore, confidence) {
  if(confidence==null) return { score:rawScore, adjusted:false, confidence:null };
  const pull=(1-confidence/100)*0.4;
  return { score:Math.round(rawScore*(1-pull)+50*pull), adjusted:confidence<80, confidence };
}

function classifyConfidence(c) {
  if(c==null) return { labelKey:"conf_none", color:C.muted, icon:"○" };
  if(c>=80)   return { labelKey:"conf_high", color:C.go, icon:"●" };
  if(c>=55)   return { labelKey:"conf_mid", color:C.caution, icon:"◐" };
  return { labelKey:"conf_low", color:C.stop, icon:"◔" };
}
function confidenceLabel(info) { return t(info.labelKey); }

// Arrow glyph for the wind-direction chart: a small shaft+head pointing in the
// direction the wind BLOWS TO. Meteo `dir` = where it comes FROM, so +180; SVG
// 0° points right, so −90 to make 0° point up (North).
const DirArrow = (props) => {
  const { cx, cy, payload } = props;
  if(cx==null || cy==null || payload?.dir==null) return null;
  const rot = payload.dir + 180 - 90;
  return (
    <g transform={`translate(${cx},${cy}) rotate(${rot})`}>
      <path d="M-7,0 L5,0 M5,0 L0,-4 M5,0 L0,4" stroke={C.caution} strokeWidth={1.5} fill="none" strokeLinecap="round" strokeLinejoin="round" />
    </g>
  );
};

      const body=mode==='signup'?{name,email,password:pw}:{email,password:pw};
      const r=await fetch(url,{method:'POST',credentials:'include',
        headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json();
      if(!r.ok)setErr(d.message||d.error||t('auth_fail'));
      else setSess(d);
    }catch{setErr(t('auth_server_err'));}
    finally{setBusy(false);}
  }

  async function doSignOut(){
    await fetch('/api/auth/sign-out',{method:'POST',credentials:'include'});
    setSess(false);setEmail('');setPw('');setErr('');
  }

  const INP={width:'100%',boxSizing:'border-box',background:CA.p2,color:CA.foam,
    border:`1px solid ${CA.line}`,borderRadius:10,padding:'11px 12px',fontSize:16};

  if(sess===null)return(
    <div style={{minHeight:'100vh',display:'grid',placeItems:'center',background:CA.deep}}>
      <p style={{color:CA.haze,fontFamily:'monospace'}}>{t('sess_checking')}</p>
    </div>
  );

  if(!sess)return(
    <div style={{minHeight:'100dvh',display:'grid',placeItems:'center',boxSizing:'border-box',
        background:`radial-gradient(120% 90% at 50% -10%,${C.surface},${C.bg})`,padding:'max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom))'}}>
      <div style={{width:'100%',maxWidth:380,background:CA.deep,
          border:`1px solid ${CA.line}`,borderRadius:18,padding:26,
          boxShadow:'0 30px 70px -30px rgba(0,0,0,.75)'}}>
        <div style={{fontSize:11,letterSpacing:'.2em',textTransform:'uppercase',
          color:CA.lift,fontWeight:700,marginBottom:6}}>WindFoil</div>
        <h1 style={{fontSize:21,fontWeight:700,color:CA.foam,margin:'0 0 4px'}}>
          {mode==='signup'?t('auth_title_signup'):t('auth_title_signin')}</h1>
        <p style={{fontSize:13,color:CA.haze,margin:'0 0 20px'}}>
          {mode==='signup'?t('auth_sub_signup'):t('auth_sub_signin')}</p>
        <div style={{display:'flex',gap:6,background:CA.p2,padding:4,borderRadius:11,marginBottom:18}}>
          {['signin','signup'].map(m=>(
            <button key={m} onClick={()=>{setMode(m);setErr('');}}
              style={{flex:1,padding:9,border:'none',borderRadius:8,cursor:'pointer',
                background:mode===m?CA.panel:'transparent',
                color:mode===m?CA.foam:CA.haze,fontWeight:600,fontSize:13}}>
              {m==='signin'?t('auth_tab_signin'):t('auth_tab_signup')}
            </button>
          ))}
        </div>
        {err&&<p style={{color:CA.coral,fontSize:13,margin:'0 0 12px'}}>{err}</p>}
        {mode==='signup'&&(
          <div style={{marginBottom:12}}>
            <label style={{display:'block',fontSize:12,color:CA.haze,marginBottom:6}}>{t('auth_name_label')}</label>
            <input style={INP} value={name} onChange={e=>setName(e.target.value)}
              autoComplete="name" placeholder={t('auth_name_placeholder')}/>
          </div>
        )}
        <div style={{marginBottom:12}}>
          <label style={{display:'block',fontSize:12,color:CA.haze,marginBottom:6}}>{t('auth_email_label')}</label>
          <input style={INP} type="email" value={email} onChange={e=>setEmail(e.target.value)}
            autoComplete="email" placeholder="mail@example.com"/>
        </div>
        <div style={{marginBottom:20}}>
          <label style={{display:'block',fontSize:12,color:CA.haze,marginBottom:6}}>
            {t('auth_pw_label')}</label>
          <input style={INP} type="password" value={pw} onChange={e=>setPw(e.target.value)}
            autoComplete={mode==='signup'?'new-password':'current-password'}
            onKeyDown={e=>e.key==='Enter'&&submit()}/>
        </div>
        <button onClick={submit} disabled={busy}
          style={{width:'100%',padding:13,border:'none',borderRadius:11,cursor:'pointer',
            background:CA.lift,color:'#fff',fontWeight:700,fontSize:14,opacity:busy?0.5:1}}>
          {busy?t('auth_btn_loading'):mode==='signup'?t('auth_btn_signup'):t('auth_btn_signin')}
        </button>
      </div>
    </div>
  );

  const isHistUser = HISTORY_EMAILS.includes(sess.user?.email);

  return(
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:'8px 16px',background:CA.deep,borderBottom:`1px solid ${CA.line}`}}>
        <span style={{fontSize:13,color:CA.haze}}>
          {t('auth_logged_as')} <b style={{color:CA.foam}}>{sess.user?.email}</b>
        </span>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          {isHistUser && (
            <button onClick={()=>setHistOpen(o=>!o)}
              style={{padding:'6px 12px',borderRadius:8,cursor:'pointer',
                border:`1px solid ${histOpen?CA.lift:CA.line}`,
                background:histOpen?CA.lift:'transparent',
                color:histOpen?'#fff':CA.foam,fontSize:13,fontWeight:600}}>
              History
            </button>
          )}
          <button onClick={doSignOut}
            style={{padding:'6px 12px',borderRadius:8,cursor:'pointer',
              border:`1px solid ${CA.line}`,background:'transparent',
              color:CA.foam,fontSize:13,fontWeight:600}}>
            {t('auth_signout')}
          </button>
        </div>
      </div>
      {histOpen && isHistUser
        ? <HistoryView onClose={()=>setHistOpen(false)}/>
        : children}
    </div>
  );
}

// ── Session feedback (post-session debrief) ────────────────────────────────────
// Wires the frontend to the existing /api/feedback backend. Resolves the current
// location to a spot first (/api/feedback/spot), then submits the debrief. The
// backend only accepts feedback for the spot-local "today".
function FeedbackModal({ loc, forecast, gear, onClose, onCalibrated }) {
  const [planed,setPlaned]     = useState(null);   // null | true | false
  const [wingM2,setWingM2]     = useState(null);   // geflogene Wing-Größe (m²)
  const [rating,setRating]     = useState(0);
  const [match,setMatch]       = useState(0);
  const [notes,setNotes]       = useState("");
  const [busy,setBusy]         = useState(false);
  const [err,setErr]           = useState("");
  const [done,setDone]         = useState(null);   // calibration result

  // Zeitfenster: von/bis als HH:MM strings (spot-lokal, Browser-Timezone).
  // Default: von = jetzt − 2 h, bis = jetzt (gerundet auf Minute).
  const defaultTimes = (() => {
    const now = new Date();
    const pad = n => String(n).padStart(2,"0");
    const fmt = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const from = new Date(now.getTime() - 2 * 60 * 60 * 1000);
    return { from: fmt(from), to: fmt(now) };
  })();
  const [startTime,setStartTime] = useState(defaultTimes.from);
  const [endTime,setEndTime]     = useState(defaultTimes.to);

  // distinct wing sizes from gear list for the select
  const wingOptions = (() => {
    if(!gear || !gear.length) return [];
    const seen = new Set();
    return gear.map(g=>parseFloat(g.wing)).filter(s=>!isNaN(s)&&seen.size<seen.add(s).size||!seen.has(s)&&!seen.add(s)).sort((a,b)=>a-b);
  })();

  const tz = (()=>{ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; }catch{ return "UTC"; } })();

  // HH:MM → ISO-8601 UTC (heute, spot-Browser-Timezone)
  function timeToIso(hhmm) {
    if(!hhmm) return null;
    const [hh,mm] = hhmm.split(":").map(Number);
    const d = new Date();
    d.setHours(hh, mm, 0, 0);
    return d.toISOString();
  }

  async function submit() {
    setBusy(true); setErr("");
    try{
      const sr = await fetch("/api/feedback/spot",{method:"POST",credentials:"include",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name:loc.name,lat:loc.lat,lon:loc.lon,timezone:tz})});
      if(!sr.ok) throw new Error("spot");
      const { spot } = await sr.json();
      const startedAt = timeToIso(startTime);
      const endedAt   = timeToIso(endTime);
      const r = await fetch("/api/feedback",{method:"POST",credentials:"include",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({spotId:spot.id,planed,
          wingM2:wingM2||null,
          startedAt, endedAt,
          rating:rating||null,conditionsMatched:match||null,notes:notes.trim()||null,
          forecast:forecast||undefined})});
      const d = await r.json();
      if(!r.ok){
        setErr(d.error==="feedback_locked"
          ? t('fb_err_locked')
          : (d.error || t('fb_err_save')));
      } else {
        const cal=d.calibration||{};
        setDone({...cal,
          wingCalibration: d.wingCalibration||[],
          _wingM2: wingM2,
          observed: d.observed,
          obsRange: d.obsRange||null,
        });
        if(onCalibrated) onCalibrated(cal);
      }
    }catch{ setErr(t('fb_err_server')); }
    finally{ setBusy(false); }
  }

  const Meter = ({value,onChange,lo,hi}) => (
    <div>
      <div style={{display:"flex",gap:6}}>
        {[1,2,3,4,5].map(n=>(
          <button key={n} type="button" onClick={()=>onChange(n)}
            style={{flex:1,height:34,borderRadius:6,cursor:"pointer",
              border:`1px solid ${value>=n&&value?C.signal:C.border2}`,
              background:value>=n&&value?C.signal:C.bg}} />
        ))}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:5,fontSize:10,color:C.muted}}>
        <span>{lo}</span><span>{hi}</span>
      </div>
    </div>
  );

  const dateLabel = new Intl.DateTimeFormat("de-DE",{weekday:"short",day:"2-digit",month:"short"}).format(new Date());
  const lbl = {display:"block",fontSize:13,fontWeight:600,color:C.text,marginBottom:8};
  const inputStyle = {background:C.bg,color:C.text,border:`1px solid ${C.border2}`,borderRadius:6,padding:"8px 10px",fontSize:15,fontFamily:"'Barlow',sans-serif"};

  return (
    <div style={{position:"fixed",top:0,left:0,right:0,height:"100dvh",background:"rgba(0,0,0,.85)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:16,paddingBottom:"max(16px, env(safe-area-inset-bottom))",boxSizing:"border-box",fontFamily:"'Barlow',sans-serif"}}>
      <div style={{background:C.panel,border:`1px solid ${C.border2}`,borderRadius:8,width:"100%",maxWidth:480,maxHeight:"100%",overflow:"auto",color:C.text}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",borderBottom:`1px solid ${C.border}`}}>
          <div>
            <div style={{fontFamily:"monospace",fontSize:10,color:C.signal,textTransform:"uppercase",letterSpacing:"0.12em",fontWeight:700}}>{t('fb_modal_label')}</div>
            <strong style={{fontSize:14}}>{loc.name}</strong>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontFamily:"monospace",fontSize:11,color:C.muted}}>{dateLabel}</span>
            <button onClick={onClose} style={{background:"none",border:"none",color:C.muted,fontSize:16,cursor:"pointer"}}>✕</button>
          </div>
        </div>

        <div style={{padding:16}}>
          {done ? (
            <div style={{textAlign:"center",padding:"12px 4px"}}>
              <div style={{width:48,height:48,borderRadius:"50%",margin:"0 auto 12px",display:"grid",placeItems:"center",background:"rgba(61,220,132,0.16)",border:`1px solid ${C.go}`,color:C.go,fontSize:24}}>✓</div>
              <p style={{fontSize:15,fontWeight:700,marginBottom:6}}>{t('fb_done_title',{date:dateLabel})}</p>
              <p style={{color:C.muted,fontSize:13,margin:0}}>{t('fb_done_sub',{name:loc.name})}</p>

              {done.observed && done.obsRange ? (
                <div style={{marginTop:14,padding:12,borderRadius:8,background:C.bg,border:`1px solid ${C.signal}`,textAlign:"left",fontSize:13,color:C.text}}>
                  <span>{t('fb_cal_station',{wing:done._wingM2||"?",lo:done.obsRange.lowKn,hi:done.obsRange.highKn,n:done.obsRange.samples,s:done.obsRange.samples===1?"":lang==="en"?"s":"en"})}</span>
                </div>
              ) : (
                <div style={{marginTop:14,padding:12,borderRadius:8,background:C.bg,border:`1px solid ${C.border2}`,textAlign:"left",fontSize:13,color:C.muted}}>
                  <span>{t('fb_cal_no_station')}</span>
                </div>
              )}

              {done.rolling!=null && (
                <div style={{marginTop:10,padding:12,borderRadius:8,background:C.bg,border:`1px solid ${C.border2}`,textAlign:"left",fontSize:13,color:C.text}}>
                  <span>{t('fb_cal_threshold',{name:loc.name,kn:done.rolling,n:done.samples,sessions:done.samples===1?t('fb_cal_session'):t('fb_cal_sessions')})}</span>
                </div>
              )}
              {(() => {
                const wc = done.wingCalibration;
                const wm = done._wingM2;
                if(!wm || !Array.isArray(wc)) return null;
                const entry = wc.find(r=>r.wingM2===wm);
                if(!entry || entry.minKn==null || entry.maxKn==null) return null;
                return (
                  <div style={{marginTop:10,padding:12,borderRadius:8,background:C.bg,border:`1px solid ${C.border2}`,textAlign:"left",fontSize:13,color:C.text}}>
                    <span>{t('fb_cal_range',{wing:wm,name:loc.name,lo:entry.minKn,hi:entry.maxKn,n:entry.samples,sessions:entry.samples===1?t('fb_cal_session'):t('fb_cal_sessions')})}</span>
                  </div>
                );
              })()}
              <button onClick={onClose} style={{marginTop:16,width:"100%",padding:12,border:"none",borderRadius:6,cursor:"pointer",background:C.signal,color:"#fff",fontWeight:700,fontSize:14}}>{t('fb_close')}</button>
            </div>
          ) : (
          <>
            {err && <p style={{color:C.stop,fontSize:13,margin:"0 0 12px"}}>{err}</p>}

            <div style={{marginBottom:18}}>
              <span style={lbl}>{t('fb_planed_q')}</span>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <button type="button" onClick={()=>setPlaned(true)}
                  style={{padding:"14px 10px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:14,
                    border:`1px solid ${planed===true?C.go:C.border2}`,
                    background:planed===true?"rgba(61,220,132,0.16)":C.bg,
                    color:planed===true?C.go:C.text}}>{t('fb_yes')}</button>
                <button type="button" onClick={()=>setPlaned(false)}
                  style={{padding:"14px 10px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:14,
                    border:`1px solid ${planed===false?C.stop:C.border2}`,
                    background:planed===false?"rgba(232,64,64,0.14)":C.bg,
                    color:planed===false?C.stop:C.text}}>{t('fb_no')}</button>
              </div>
            </div>

            <div style={{marginBottom:18}}>
              <span style={lbl}>{t('fb_wing_label')}</span>
              {wingOptions.length > 0 ? (
                <select value={wingM2||""} onChange={e=>setWingM2(e.target.value?parseFloat(e.target.value):null)}
                  style={{width:"100%",...inputStyle}}>
                  <option value="">{t('fb_wing_not_set')}</option>
                  {wingOptions.map(s=><option key={s} value={s}>{s} m²</option>)}
                </select>
              ) : (
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontFamily:"monospace",fontSize:22,fontWeight:700,color:C.text}}>{wingM2!=null?`${wingM2} m²`:"—"}</span>
                  <div style={{display:"flex",gap:6}}>
                    <button type="button" onClick={()=>setWingM2(w=>w!=null?Math.max(1,Math.round((w-0.5)*2)/2):null)} style={{width:36,height:36,borderRadius:6,cursor:"pointer",border:`1px solid ${C.border2}`,background:C.panel,color:C.text,fontSize:16}}>−</button>
                    <button type="button" onClick={()=>setWingM2(w=>w!=null?Math.min(20,Math.round((w+0.5)*2)/2):3.0)} style={{width:36,height:36,borderRadius:6,cursor:"pointer",border:`1px solid ${C.border2}`,background:C.panel,color:C.text,fontSize:16}}>+</button>
                  </div>
                </div>
              )}
            </div>

            <div style={{marginBottom:18}}>
              <span style={lbl}>{t('fb_session_window')}</span>
              <p style={{fontSize:11,color:C.muted,marginTop:0,marginBottom:10}}>{t('fb_session_hint')}</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div>
                  <span style={{fontSize:11,color:C.muted,display:"block",marginBottom:4}}>{t('fb_from')}</span>
                  <input type="time" value={startTime} onChange={e=>setStartTime(e.target.value)}
                    style={{width:"100%",boxSizing:"border-box",...inputStyle}} />
                </div>
                <div>
                  <span style={{fontSize:11,color:C.muted,display:"block",marginBottom:4}}>{t('fb_to')}</span>
                  <input type="time" value={endTime} onChange={e=>setEndTime(e.target.value)}
                    style={{width:"100%",boxSizing:"border-box",...inputStyle}} />
                </div>
              </div>
            </div>

            <div style={{marginBottom:18}}>
              <span style={lbl}>{t('fb_session_q')}</span>
              <Meter value={rating} onChange={setRating} lo={t('fb_session_lo')} hi={t('fb_session_hi')} />
            </div>

            <div style={{marginBottom:18}}>
              <span style={lbl}>{t('fb_forecast_q')}</span>
              <Meter value={match} onChange={setMatch} lo={t('fb_forecast_lo')} hi={t('fb_forecast_hi')} />
            </div>

            <div style={{marginBottom:18}}>
              <span style={lbl}>{t('fb_notes_label')}</span>
              <textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={3}
                placeholder={t('fb_notes_placeholder')}
                style={{width:"100%",boxSizing:"border-box",background:C.bg,color:C.text,border:`1px solid ${C.border2}`,borderRadius:8,padding:"10px 12px",fontSize:14,fontFamily:"'Barlow',sans-serif",resize:"vertical"}} />
            </div>

            <button type="button" disabled={busy} onClick={submit}
              style={{width:"100%",padding:14,border:"none",borderRadius:8,cursor:busy?"not-allowed":"pointer",background:C.signal,color:"#fff",fontWeight:700,fontSize:15,opacity:busy?0.5:1}}>
              {busy ? t('fb_submit_loading') : t('fb_submit')}
            </button>
          </>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [loc,setLoc]           = useState(()=>loadStored("wf_loc",{lat:48.0703,lon:11.1167,name:"Wörthsee / Pilsensee"}));
  const [rider,setRider]       = useState(()=>loadStored("wf_rider",{weight:80,wingSize:5.0,skill:"intermediate",planeKn:""}));
  const [ri,setRi]             = useState(()=>loadStored("wf_rider",{weight:80,wingSize:5.0,skill:"intermediate",planeKn:""}));
  const [gear,setGear]         = useState(()=>loadStored("wf_gear",[])); // [{id,name,wing,planeKn}]
  const [useGear,setUseGear]   = useState(()=>loadStored("wf_usegear",false));
  const [profileSaved,setProfileSaved] = useState(false);
  const [locSaved,setLocSaved] = useState(false);
  const [newGear,setNewGear]   = useState({name:"",wing:"5.0",planeKn:""});
  const [forecast,setForecast] = useState(null);
  const [historical,setHist]   = useState(null);
  const [loading,setLoading]   = useState(true);
  const [loadMsg,setLoadMsg]   = useState(()=>t("loading_connect"));
  const [apiStatus,setApiStatus]= useState({forecast:"⏳",historical:"⏳"});
  const [activeDay,setActiveDay]= useState(0);
  const [measured,setMeasured] = useState(null); // real station feed for the active day (null = none)
  const [live,setLive] = useState(null); // current-only real station snapshot (null = none)
  const [mos,setMos] = useState(null); // gelernte Stunden-Bias-Korrektur (null = keine Station/keine Daten)
  const [clock,setClock]       = useState("");
  const [activeUsers,setActiveUsers] = useState(null);
  const [windUnit,setWindUnit]  = useState("kn"); // 'ms' | 'kn' | 'bf'
  const [theme,setThemeState]   = useState(()=>loadStored("wf_theme","dark")); // 'dark' | 'light'
  const [langState,setLangState] = useState(()=>loadStored("wf_lang","de")); // 'de' | 'en'
  // Apply the palette synchronously so the style object S (built below) and all
  // C.* reads in this render already reflect the active theme.
  applyTheme(theme==="light"?"light":"dark");
  // Update module-level lang so t() calls in this render see the current language.
  lang = langState;
  // Persisting setter (localStorage cache + per-user server store).
  const setTheme = (tval)=>{ setThemeState(tval); savePref("wf_theme", tval); };
  // Keep the page/body background (visible during overscroll) in sync.
  useEffect(()=>{
    const bg = (THEMES[theme]||THEMES.dark).bg;
    document.documentElement.style.background = bg;
    document.body.style.background = bg;
  },[theme]);
  useEffect(()=>{
    document.getElementById("htmlRoot").setAttribute("lang", langState);
  },[langState]);
  const [showLoc,setShowLoc]   = useState(false);
  const [showFeedback,setShowFeedback] = useState(false);
  // Per-location calibrated planing threshold (from this spot's feedback only).
  const [spotCal,setSpotCal]   = useState(null); // {rolling,samples,wingRanges?} | null

  // Pull the calibrated planing threshold + wing ranges for the CURRENT location
  // (if the rider has logged feedback there). Read-only — never creates a spot.
  // Falls back to null (=> formula / manual override) when signed out or no local feedback.
  useEffect(()=>{
    let cancelled=false;
    if(loc&&loc.lat!=null&&loc.lon!=null){
      fetch(`/api/feedback/spot-calibration?lat=${loc.lat}&lon=${loc.lon}`,{credentials:"include"})
        .then(r=>r.ok?r.json():null)
        .then(d=>{
          if(!cancelled) {
            const cal = d&&d.calibration&&d.calibration.rolling!=null ? d.calibration : null;
            const wr = d&&Array.isArray(d.wingRanges) ? d.wingRanges : [];
            setSpotCal(cal ? {...cal, wingRanges: wr} : (wr.length ? {rolling:null,samples:0,wingRanges:wr} : null));
          }
        })
        .catch(()=>{ if(!cancelled) setSpotCal(null); });
    }
    return ()=>{ cancelled=true; };
  },[loc&&loc.lat,loc&&loc.lon]);

  // Hydrate the active spot + recent list from the SERVER on mount. This is what
  // makes manually added spots survive on iOS Safari, where localStorage is
  // dropped (Private Browsing / "Block All Cookies" / ITP). localStorage is now
  // only an offline cache; the server copy wins when it's available.
  useEffect(()=>{
    let cancelled=false;
    fetch("/api/locations",{credentials:"include"})
      .then(r=>r.ok?r.json():null)
      .then(d=>{
        if(cancelled||!d) return;
        if(Array.isArray(d.recent)&&d.recent.length){ setRecent(d.recent); saveStored("wf_loc_recent",d.recent); }
        if(d.active&&d.active.lat!=null&&d.active.lon!=null){ setLoc(d.active); saveStored("wf_loc",d.active); }
      })
      .catch(()=>{});

  // ── Find REAL weather stations near the spot ────────────────────────────────
  // Server-side discovery via Meteostat (keyless bulk metadata, haversine within
  // an adaptive radius); current wind for the nearest few comes from the
  // Weatherbit-backed proxy. Replaces the old fake "grid sample" approximation.
  async function fetchNearbyStations(lat, lon) {
    setNearbyStatus("loading");
    try {
      const r = await fetch(`${PROXY_BASE}/nearby?lat=${lat}&lon=${lon}`, { signal: AbortSignal.timeout(15000) });
      const d = await r.json();
      if(d && d.ok && Array.isArray(d.stations) && d.stations.length){
        setNearbyStations(d.stations);
        setNearbyRadius(d.radiusKm ?? null);
        setNearbyStatus(d.stations.some(s=>s.src==="obs") ? "live" : d.stations.some(s=>s.src==="model") ? "model" : "meta");
        return;
      }
      setNearbyStations([]);
      setNearbyRadius(null);
      setNearbyStatus("unavailable");
    } catch(e) {
      setNearbyStations([]);
      setNearbyRadius(null);
      setNearbyStatus("unavailable");
    }
  }

  // ── Reverse geocode coords → place name via Open-Meteo (no key needed) ──────
  async function reverseGeocode(lat, lon) {
    try {
      const url = `https://geocoding-api.open-meteo.com/v1/search?latitude=${lat}&longitude=${lon}&count=1&language=de`;
      const r = await fetch(url, { signal: AbortSignal.timeout(5000) });
      if(r.ok){
        const d = await r.json();
        if(d.results && d.results[0]){
          const p = d.results[0];
          return [p.name, p.admin1, p.country].filter(Boolean).join(", ");
        }
      }
    } catch(e) { /* fall through */ }
    return null;
  }

  // ── Use the device's current GPS position ───────────────────────────────────
  function useMyLocation() {
    setGeoError("");
    if(!("geolocation" in navigator)){
      setGeoError(t('geo_not_supported'));
      return;
    }
    setGeoStatus("loading");
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = Math.round(pos.coords.latitude  * 10000) / 10000;
        const lon = Math.round(pos.coords.longitude * 10000) / 10000;
        const name = await reverseGeocode(lat, lon);
        const nl = { lat, lon, name: name || `${t('gps_my_location')} (${lat.toFixed(3)}°, ${lon.toFixed(3)}°)` };
        setLoc(nl);
        pushRecent(nl);
        setGeoStatus("");
        setShowLoc(false);
      },
      (err) => {
        setGeoStatus("error");
        const msg = err.code === 1 ? t('geo_denied')
                  : err.code === 2 ? t('geo_unavail')
                  : err.code === 3 ? t('geo_timeout')
                  : t('geo_generic');
        setGeoError(msg);
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  }

  const loadData = useCallback(async(l) => {
