  <script>
    /* Pre-paint the saved theme before React mounts, to avoid a dark flash in light mode. */
    try {
      if (JSON.parse(localStorage.getItem("wf_theme")) === "light") {
        document.documentElement.style.background = document.body.style.background = "#e7edf3";
        var b = document.getElementById("boot");
        if (b) { b.style.background = "#e7edf3"; b.style.color = "#5b7186"; }
      }
    } catch (e) {}
  </script>
  <script>
    /* Update boot message and html lang from saved language preference. */
    try {
      const wl = JSON.parse(localStorage.getItem("wf_lang"));
      if (wl === "en") {
        const bm = document.getElementById("bootMsg");
        if (bm) bm.textContent = "Loading WindFoil…";
        document.getElementById("htmlRoot").setAttribute("lang", "en");
      }
    } catch(e) {}
