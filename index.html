    try {
      // Trägermodell und Ensemble parallel. Das Ensemble ist NICHT fatal: fällt
      // es aus, rechnet die App wie vorher mit dem Trägermodell weiter.
      const [fcRes, ensRes, mosRes] = await Promise.all([
        tryFetchForecast(l.lat, l.lon),
        tryFetchEnsemble(l.lat, l.lon).catch(()=>null),
        fetchStationMos(l.lat, l.lon).catch(()=>null),
      ]);
      fc = fcRes;
      // MOS MUSS vor applyPelerBoost feststehen: der Pelèr-Faktor blendet sich aus,
      // sobald MOS an dieser Stunde sicher ist (B3, Doppelzählung am Gardasee). Käme
      // mos aus einem eigenen useEffect, entschiede ein Race, ob der Guard greift.
      const mosData = (mosRes && mosRes.ok) ? mosRes : null;
      setMos(mosData);
      attachEnsemble(fc, ensRes);
      applyPelerBoost(fc, l.lat, l.lon, mosData);   // lift the under-forecast channeled N-wind at Garda
      applyMeltemBoost(fc, l.lat, l.lon, mosData);  // lift the under-forecast Meltemi/Eric at Lefkada
      const ml = MODEL_LABELS[fc.__model];
      const ensTag = fc.__ens ? ` (${fc.__ens.members.length})` : "";
      const boostTag = fc.__pelerBoost ? " +Pelèr" : fc.__meltemBoost ? ` +${fc.__meltemBoost}` : "";
      setApiStatus(s=>({...s,forecast:(ml ? `✅ ${ml}${ensTag}` : "✅ Live")+boostTag}));
      setLoadMsg(t("loading_era5"));
    } catch(e) {
      setApiStatus(s=>({...s,forecast:"⚠️ Demo"}));

    // Fetch historical independently – fallback to demo

    }
    setHist(hist);
    setActiveDay(0);
    setLoading(false);
    // Load nearby stations in the background (non-blocking)

    // Real station vs model comparison (non-blocking)

  },[]);

  // ── Compare REAL station data to the model → confidence score ──────────────
  async function runStationComparison(lat, lon, fc, hist) {
    setStationCmpStatus("loading");
    const [cur, bias] = await Promise.all([
      fetchStationCurrent(lat, lon),
      fetchStationBias(lat, lon),
    ]);
    const biasOk = !!(bias && bias.ok);

    // If neither a current observation nor a station bias is available, graceful.
    if((!cur || !cur.ok) && !biasOk){
      setStationCmp({ available:false, current:cur, bias });
      setStationCmpStatus("unavailable");
      return;
    }

    // Model current values (this hour) from forecast
    const nowH = new Date().getHours();
    const modelCurrentWind = fc?.hourly?.windspeed_10m?.[nowH] ?? null;
    const modelCurrentDir  = fc?.hourly?.winddirection_10m?.[nowH] ?? null;

    // Historical means come from the overlapping-window bias (real station obs vs
    // Open-Meteo archive over the SAME dates/hours). Both already in m/s.
    const stationHistMeanWind = biasOk ? bias.stationMeanMs : null;
    const modelHistMeanWind   = biasOk ? bias.modelMeanMs   : null;

    // Median der Ensemble-Streuung über die Mittagsstunden (Index 11..18).
    // Die direkte Indizierung folgt der bereits bestehenden Annahme dieser Funktion
    // (siehe modelCurrentWind oben, das fc.hourly.windspeed_10m[nowH] genauso direkt
    // indiziert): das Array beginnt bei Mitternacht des heutigen Tages.
    // fc trägt __ens hier bereits — loadData ruft uns nach attachEnsemble auf.
    const spreads = (fc?.__ens?.spread || []).slice(11,19).filter(v=>v!=null);
    const ensSpreadMs = spreads.length ? spreads.slice().sort((a,b)=>a-b)[Math.floor(spreads.length/2)] : null;

    const { confidence, notes } = computeConfidence({
      stationCurrent: cur, modelCurrentWind, modelCurrentDir,
      stationHistMeanWind, modelHistMeanWind, ensSpreadMs,
    });

    setStationCmp({
      available:true, current:cur, bias,
      modelCurrentWind, modelCurrentDir,
      stationHistMeanWind, modelHistMeanWind,
      confidence, notes,
    });
    setStationCmpStatus("ok");
  }

  useEffect(()=>{ loadData(loc); },[loc]);

  // ── Real measured-station overlay (ground truth vs forecast) ──────────────
  // For spots with a live anemometer (e.g. Torbole) fetch the actual measured
  // wind/gust for the displayed day. Backend no-ops for spots without one, so
  // the overlay simply doesn't appear elsewhere. Keyed by the day's date so it
  // stays correct when switching day tabs.
  useEffect(()=>{
    if(!forecast || !forecast.hourly.time.length){ setMeasured(null); return; }
    const times=forecast.hourly.time;
    const [fy,fm,fd]=times[0].slice(0,10).split('-').map(Number);
    const t=new Date(fy,fm-1,fd+activeDay);

    let cancelled=false;

      .then(r=>r.json())
      .then(d=>{ if(!cancelled) setMeasured(d&&d.ok?d:null); })
      .catch(()=>{ if(!cancelled) setMeasured(null); });
    return ()=>{ cancelled=true; };
  },[forecast,activeDay,loc]);

  // ── Live "now" marker for spots with a current-only anemometer (e.g. Talamone)
  // Backend no-ops (ok:false) where no live station exists. Refreshes each minute
  // to track the ~60 s feed; independent of the displayed day (always "now").
  useEffect(()=>{
    if(!loc){ setLive(null); return; }
    let cancelled=false;
    const load=()=>fetch(`/api/station/live?lat=${loc.lat}&lon=${loc.lon}`)
      .then(r=>r.json())

      .catch(()=>{ if(!cancelled) setLive(null); });

  // ── Compute day start indices from actual calendar dates ──────────────────
  // API may start mid-day (e.g. 17:00 local time) — find index where each
  // calendar day (00:00) begins, so "Heute" = today's 00:00 not hour[0]
  const dayStartIndices = (() => {
    if(!forecast) return [0,24,48,72,96,120,144];
    const times = forecast.hourly.time;
    if(!times.length) return [0,24,48,72,96,120,144];
    // CRITICAL: data is in the SPOT's timezone (timezone=auto), which may differ
    // from the user's browser clock. Anchor "today" to the FIRST timestamp's
    // calendar date in the data itself, so days are always correct for any user.
    const firstDateStr = times[0].slice(0,10);          // "2026-05-30"
    const [fy,fm,fd] = firstDateStr.split('-').map(Number);
    const result = [];
    for(let d=0; d<7; d++){
      // Build the target date by adding d days to the data's first date
      const target = new Date(fy, fm-1, fd + d);
      const y=target.getFullYear(), m=String(target.getMonth()+1).padStart(2,'0'), dy=String(target.getDate()).padStart(2,'0');
      const prefix = `${y}-${m}-${dy}`;
      let idx = times.findIndex(t => typeof t==="string" && t.startsWith(prefix));
      if(idx === -1) idx = d * 24;
      result.push(idx);
    }
    return result;
  })();

  // Effective planing threshold for the ACTIVE location: a spot-calibrated value
  // (derived from THIS spot's feedback) takes precedence over the rider's manual
  // override; otherwise null => fall back to the formula. This keeps the local
  // wind assessment shaping only the local score, never the global rider profile.
  const effPlaneMs = (spotCal && spotCal.rolling!=null) ? knToMs(spotCal.rolling)
                   : (rider.planeKn ? knToMs(parseFloat(rider.planeKn)) : null);

  // Wing-range map for the active spot: { [String(wingM2)]: {minKn,maxKn,samples} }
  // Built from the wingRanges array in spotCal (populated by /spot-calibration response).
  const spotWingMap = (() => {
    const wr = spotCal && spotCal.wingRanges;
    if(!Array.isArray(wr) || !wr.length) return null;
    const m = {};
    for(const r of wr) m[String(r.wingM2)] = r;
    return m;
  })();

  // ── Active window helper: foil or kite mode ─────────────────────────────────
  function getActiveWin(){
    if(sport==="kite"){
      const kite=CRAZYFLY_KITES.find(k=>k.model===kiteRider.kiteModel);
      const size=kite?.sizes.find(s=>s.m===kiteRider.kiteSize);
      if(kite&&size) return calcKiteWindow(size.minKn,size.maxKn,kiteRider.skill,kiteRider.weight);
    }
    return wingWindow(rider.weight,rider.wingSize,rider.skill, effPlaneMs, DEFAULT_WING_BRAND, spotWingMap?.[String(rider.wingSize)]);
  }

  // ── Derived day data ────────────────────────────────────────────────────────
  const dayData = (() => {
    if(!forecast) return null;
    const h=forecast.hourly, s=dayStartIndices[activeDay] ?? activeDay*24;
    // Wind kommt aus dem Ensemble-Median, Böen/Richtung/CAPE vom Trägermodell.
    // Stunden ohne Ensemble-Wert (zu wenige Member) fallen auf den Träger zurück —
    // combineEnsemble erfindet dort bewusst keinen Wert.
    const carrierWins=h.windspeed_10m.slice(s,s+24);
    const ensD=forecast.__ens ? {
      wind:  forecast.__ens.wind.slice(s,s+24),
      p10:   forecast.__ens.p10.slice(s,s+24),
      p90:   forecast.__ens.p90.slice(s,s+24),
      spread:forecast.__ens.spread.slice(s,s+24),
      nMembers:forecast.__ens.nMembers.slice(s,s+24),
      members:forecast.__ens.members,
    } : null;
    const wins=ensD ? ensD.wind.map((w,i)=> w==null ? carrierWins[i] : w) : carrierWins;
    const gustRaw=h.windgusts_10m.slice(s,s+24);
    const gust=ensD ? rescaleGusts(gustRaw, carrierWins, wins) : gustRaw;
    const dirs=h.winddirection_10m.slice(s,s+24);
    const temp=h.temperature_2m.slice(s,s+24);
    const pres=h.surface_pressure.slice(s,s+24);
    const labels=Array.from({length:24},(_,i)=>{
      const t=h.time[s+i];
      // Parse directly from ISO string to avoid timezone offset bugs
      if(t){ const hh=t.slice(11,13), mm=t.slice(14,16); return `${hh}:${mm}`; }
      return `${String(i).padStart(2,'0')}:00`;
    });
    const regime=thermalRegime(loc.lat,loc.lon);
    const thermik=Array.from({length:24},(_,i)=>computeThermik(h,s+i,regime));
    const activeDateStr = h.time[s] ? h.time[s].slice(0,10) : null;
    // Thermik VOR den Stationskorrekturen — siehe Kommentar oben zu k.
    const month_n=new Date().getMonth()+1;
    const tcs = wins.map((w,i)=> thermalCorrection(i, dirs[i]??180, month_n, regime, mos, activeDay));
    const winsTh = wins.map((w,i)=> w==null ? w : Math.round((w + tcs[i].addMs)*100)/100);
    const lb = applyLiveStationBoost(winsTh, gust, live, activeDay===0);
    const mc = applyMeasuredStationCorrection(lb.wins, lb.gust, measured, activeDateStr);
    const winsEff = mc.wins, gustEff = mc.gust;
    const slice=(arr,a,b)=>arr.slice(a,b).filter(Boolean);
    const midW=slice(winsEff,12,16).reduce((a,b)=>a+b,0)/4||winsEff[12]||0;
    const midG=slice(gustEff,12,16).reduce((a,b)=>a+b,0)/4||gustEff[12]||0;
    const midDir=dirs[14]??dirs[12]??180;
    // midW kommt jetzt aus winsEff, das die Thermik SCHON enthält — effW darf sie
    // deshalb nicht noch einmal draufrechnen.
    const tcPeak=thermalCorrection(regime?.peakHour??14,midDir,month_n,regime,mos,activeDay);
    const sb=tcPeak.sb;
    const effW=midW;
    // Per-hour boosted winds for scoring (Eric/Meltemi thermik applied each hour)
    let win, pickedGear=null;
    if(sport==="foil" && useGear && gear.length){
      const best = pickBestSetup(gear, rider.weight, rider.skill, midW, spotWingMap);
      if(best){ win = best.win; pickedGear = best.gear; }
    }
    if(!win){
      win=getActiveWin();
    }
    // winsEff enthält die Thermik bereits (siehe winsTh oben). Ein zweiter
    // Durchgang wäre genau die Doppelzählung, gegen die thermalCorrection baut.
    const winsEffBoosted=winsEff;
    const scores=winsEffBoosted.map(w=>scoreHour(w,win));
    const avgW=winsEffBoosted.reduce((a,b)=>a+b,0)/winsEffBoosted.length;
    const maxG=Math.max(...gustEff);
    const maxT=Math.max(...temp);
    const maxTh=Math.max(...thermik);
    const dayScore=scoreDay(winsEffBoosted,win);
    const session=bestSession(winsEffBoosted,win); // {score,startHour,endHour}
    const thInfo=classifyThermik(maxTh);
    return{wins,gust,dirs,temp,pres,labels,thermik,win,scores,avgW,maxG,maxT,maxTh,midW,midG,sb,regime,effW,winsEffBoosted,dayScore,thInfo,pickedGear,session,liveBoost:lb,measuredCorr:mc,ens:ensD,carrierWins,thermal:tcPeak,thermalHours:tcs};
  })();

  const dayScores = forecast ? Array.from({length:7},(_,d)=>{
    const start = dayStartIndices[d] ?? d*24;
    // Dieselbe Windquelle wie dayData — sonst bewerten die Tages-Tabs einen
    // anderen Wind als der angezeigte Tag. Genau diese Inkonsistenz war der
    // Bug, den v3.19.0 für die Thermik behoben hat.
    const srcW = forecast.__ens
      ? forecast.__ens.wind.map((w,i)=> w==null ? forecast.hourly.windspeed_10m[i] : w)
      : forecast.hourly.windspeed_10m;
    // representative wind for the day (midday avg) to pick gear
    const dw = srcW.slice(start+12,start+16).filter(Boolean);
    const dayMidW = dw.length ? dw.reduce((a,b)=>a+b,0)/dw.length : (srcW[start+13]||0);
    let win;
    if(sport==="foil" && useGear && gear.length){
      const best = pickBestSetup(gear, rider.weight, rider.skill, dayMidW, spotWingMap);
      if(best) win = best.win;
    }
    if(!win) win=getActiveWin();
    const dstr = forecast.hourly.time[start] ? forecast.hourly.time[start].slice(0,10) : null;
    let slice = srcW.slice(start, start+24);
    let gslice= forecast.__ens
      ? rescaleGusts(forecast.hourly.windgusts_10m.slice(start,start+24),
                     forecast.hourly.windspeed_10m.slice(start,start+24), slice)
      : forecast.hourly.windgusts_10m.slice(start, start+24);
    const dirs_d=forecast.hourly.winddirection_10m.slice(start,start+24);
    const regime_d=thermalRegime(loc.lat,loc.lon);
    const month_d=new Date().getMonth()+1;
    slice=slice.map((w,i)=> w==null ? w : Math.round((w + thermalCorrection(i, dirs_d[i]??180, month_d, regime_d, mos, d).addMs)*100)/100);
    if (d === 0) { const lb=applyLiveStationBoost(slice,gslice,live,true); slice=lb.wins; gslice=lb.gust; }
    if (d === activeDay) { const mc=applyMeasuredStationCorrection(slice,gslice,measured,dstr); slice=mc.wins; gslice=mc.gust; }
    return scoreDay(slice, win, 0);
  }) : [];

  const dayNames = forecast ? (() => {
    const times = forecast.hourly.time;
    const firstDateStr = (times && times.length) ? times[0].slice(0,10) : null;
    // Anchor day labels to the data's first calendar date (spot timezone)
    const [fy,fm,fd] = firstDateStr ? firstDateStr.split('-').map(Number) : [0,0,0];
    // Is the data's first day actually "today" in the user's perception?
    // We label relative to the data itself for consistency across timezones.
    return Array.from({length:7},(_,d)=>{
      if(!firstDateStr) return `Tag ${d+1}`;
      const target = new Date(fy, fm-1, fd + d);
      if(d===0) return t('day_heute');
      if(d===1) return t('day_morgen');
      const loc_code = lang==="en" ? "en-GB" : "de-DE";
      return target.toLocaleDateString(loc_code,{weekday:'short',day:'numeric',month:'numeric'});
    });
  })() : [];

  const histData = (() => {
    if(!historical||!dayData) return [];
    const hw=historical.hourly.windspeed_10m, ht=historical.hourly.time;
    const days=Math.floor(hw.length/24);
    const res=[];
    for(let d=0;d<Math.min(days,7);d++){
      const sl=hw.slice(d*24,d*24+24).filter(v=>v!=null);
      const avg=sl.length?sl.reduce((a,b)=>a+b,0)/sl.length:0;
      let label=`T-${days-d}`;
      if(ht[d*24]){ const [y,mo,dy]=ht[d*24].slice(0,10).split('-').map(Number); const loc_code=lang==="en"?"en-GB":"de-DE"; label=new Date(y,mo-1,dy).toLocaleDateString(loc_code,{weekday:'short',day:'numeric'}); }
      res.push({label,era5:Math.round(avg*10)/10,prog:null});
    }
    res.push({label:t('day_heute'),era5:null,prog:Math.round(cvt(dayData.avgW,windUnit)*10)/10});
  // convert era5 values too
  return res.map(r=>({...r,era5:r.era5!=null?Math.round(cvt(r.era5,windUnit)*10)/10:null}));
  })();

  // ── Recommendation ──────────────────────────────────────────────────────────
  const rec = (() => {
    if(!dayData) return "";
    const{effW,midG,win,pickedGear}=dayData;
    if(sport==="kite") return kiteRec(effW,midG,win,kiteRider.kiteModel,kiteRider.kiteSize,kiteRider.skill,windUnit);
    const{weight,wingSize,skill}=rider;
    const lines=[];
    if(pickedGear){
      const gname = pickedGear.name ? `<b>${pickedGear.name}</b>` : "Setup";
      const planePart = pickedGear.planeKn ? t('rec_setup_plane',{kn:pickedGear.planeKn}) : "";
      lines.push(t('rec_setup',{name:gname,wing:pickedGear.wing,plane:planePart}));
    }
    if(effW<win.minWind){
      lines.push(t('rec_too_little',{w:fmtW(effW,windUnit),min:fmtW(win.minWind,windUnit)}));
      lines.push(t('rec_too_little_tip'));
    } else if(effW<=win.optMax){
      lines.push(t('rec_optimal',{w:fmtW(effW,windUnit),optMin:fmtW(win.optMin,windUnit),optMax:fmtW(win.optMax,windUnit)}));
      if(!pickedGear) lines.push(t('rec_optimal_rider',{sz:wingSize,kg:weight,skill}));
    } else if(effW<=win.maxWind){
      lines.push(t('rec_overpowered',{w:fmtW(effW,windUnit)}));
      lines.push(t('rec_overpowered_tip',{x:(wingSize-0.5).toFixed(1)}));
    } else {
      lines.push(t('rec_too_much',{w:fmtW(effW,windUnit),max:fmtW(win.maxWind,windUnit)}));
      lines.push(t('rec_too_much_tip'));
    }
    if(midG-effW>4) lines.push(t('rec_gust_delta',{dw:fmtW(midG-effW,windUnit)}));
    lines.push(t('rec_window',{min:fmtW(win.minWind,windUnit),optMin:fmtW(win.optMin,windUnit),optMax:fmtW(win.optMax,windUnit),max:fmtW(win.maxWind,windUnit)}));
    return lines.join("<br>");
  })();

  // ── Chart data ──────────────────────────────────────────────────────────────
  // Real measured series for THIS day (only when the feed's date matches the
  // displayed day). Aligned to the chart by the row's clock hour, not its index.
  const activeDateStr = forecast ? (forecast.hourly.time[dayStartIndices[activeDay]]||"").slice(0,10) : null;
  const meas = (measured && measured.ok && measured.date===activeDateStr) ? measured.hourly : null;
  const windData  = dayData?dayData.labels.map((l,i)=>{
    const hh=parseInt(l.slice(0,2),10);
    const mw = meas && meas.wind[hh]!=null ? cvt(meas.wind[hh],windUnit) : null;
    const mg = meas && meas.gust[hh]!=null ? cvt(meas.gust[hh],windUnit) : null;
    // Streuungsband = rohes Ensemble-p10/p90, BEWUSST nicht MOS-korrigiert. Es
    // beantwortet "wie uneinig sind die Modelle", nicht "wie systematisch falsch
    // liegen sie" — das sind zwei verschiedene Fragen, die nicht vermischt werden.
    const band = dayData.ens && dayData.ens.p10[i]!=null && dayData.ens.p90[i]!=null
      ? [cvt(dayData.ens.p10[i],windUnit), cvt(dayData.ens.p90[i],windUnit)] : null;
    return {h:l,wind:cvt(dayData.winsEffBoosted[i],windUnit),gust:cvt(dayData.gust[i],windUnit),score:dayData.scores[i],mwind:mw,mgust:mg,band,hh};
  }).filter(d=>d.hh>=6&&d.hh<=23):[];
  // Per-hour best gear/kite size — only when wind is actually within the equipment window
  const gearByHour = (() => {
    if (!dayData) return null;
    const { winsEffBoosted, labels } = dayData;
    return labels.map((_, i) => {
      const w = winsEffBoosted[i];
      if (!w || w < 0.5) return null;
      if (sport === "kite") {
        const kite = CRAZYFLY_KITES.find(k => k.model === kiteRider.kiteModel);
        if (!kite) return null;
        let best = null, bestPri = -1;
        for (const s of kite.sizes) {
          const adj = calcKiteWindow(s.minKn, s.maxKn, kiteRider.skill, kiteRider.weight);
          const inOpt = w >= adj.optMin && w <= adj.optMax;
          const inRange = w >= adj.minWind && w <= adj.maxWind;
          const pri = inOpt ? 2 : inRange ? 1 : 0;
          if (pri > bestPri) { bestPri = pri; best = { m: s.m, pri }; }
        }
        return best && best.pri > 0 ? { label: `${best.m}m`, score: best.pri === 2 ? 88 : 50 } : null;
      }
      if (useGear && gear.length) {
        const b = pickBestSetup(gear, rider.weight, rider.skill, w, spotWingMap);
        // Only show when wind is actually within this gear's window
        if (!b || w < b.win.minWind || w > b.win.maxWind) return null;
        return { label: `${parseFloat(b.gear.wing)}m`, score: b.score };
      }
      // No personal gear — recommend from manufacturer table, only when in range
      const brand = WING_BRANDS[DEFAULT_WING_BRAND];
      if (!brand) return null;
      const sizes = Object.keys(brand.sizes).map(Number).sort((a, b) => a - b);
      let best2 = null, bestSc = -1;
      for (const s of sizes) {
        const win = wingWindow(rider.weight, s, rider.skill, null);
        if (w < win.minWind || w > win.maxWind) continue;
        const sc = scoreHour(w, win);
        if (sc > bestSc) { bestSc = sc; best2 = { m: s }; }
      }
      return best2 ? { label: `${best2.m}m`, score: bestSc } : null;
    });
  })();
  // Custom XAxis tick: 3h time labels top row; wing/kite size shown as text on first
  // occurrence of a size, as a dot for consecutive same-size hours — no overlap.
  const FensterTick = ({x, y, payload, ghour, lbls}) => {
    const i = (lbls??[]).indexOf(payload?.value);
    const g = i >= 0 ? ghour?.[i] : null;
    const show3h = i >= 0 && i % 3 === 0;
    if (!show3h && !g) return null;
    const col = !g ? null : g.score >= 75 ? C.go : C.caution;
    const prev = i > 0 ? ghour?.[i - 1] : null;
    const sizeChanged = !prev || prev.label !== g?.label;
    return (
      <g transform={`translate(${x},${y})`}>
        {show3h && <text textAnchor="middle" fill={ax.tick.fill} fontSize={9} fontFamily="monospace" dy={11}>{payload?.value}</text>}
        {g && sizeChanged && <text textAnchor="middle" fill={col} fontSize={8} fontFamily="monospace" fontWeight="bold" dy={22}>{g.label}</text>}
        {g && !sizeChanged && <circle cx={0} cy={19} r={2.5} fill={col} />}
      </g>
    );
  };

  const dirData   = dayData?dayData.labels.map((l,i)=>({idx:i,dir:dayData.dirs[i]})):[];
  const tempData  = dayData?dayData.labels.map((l,i)=>({h:l,temp:dayData.temp[i]})):[];
  const presData  = dayData?dayData.labels.map((l,i)=>({h:l,pres:Math.round(dayData.pres[i])})):[];
  const thData    = dayData?dayData.labels.map((l,i)=>({h:l,th:dayData.thermik[i]})):[];

  const sc2col = s => s>=75?C.go:s>=45?C.caution:C.stop;

  // ── Styles ──────────────────────────────────────────────────────────────────
  // ── Admin login: password → server validates against env file → returns token ─
  // The password is NEVER stored in the frontend. It is sent to the proxy, which
  // checks it against ADMIN_PASSWORD (from windfoil.env) and returns the token.
  async function adminLogin() {
    setAdminErr("");
    if (!adminPw) { setAdminErr("Bitte Passwort eingeben."); return; }
    setAdminBusy(true);
    try {
      const r = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: adminPw }),
      });
      const d = await r.json();
      if (d.ok && d.token) {
        setAdminToken(d.token);   // held only in memory for this session
        setAdminAuthed(true);
        setAdminPw("");           // clear password from state
        setAdminErr("");
      } else {
        setAdminErr(d.error || "Login fehlgeschlagen.");
      }
    } catch(e) { setAdminErr("Server nicht erreichbar (läuft der Proxy?)."); }
    setAdminBusy(false);
  }
  async function adminRun(path, label) {
    setAdminBusy(true); setAdminOut(`▶ ${label}…`); setAdminErr("");
    try {
      const r = await fetch(`/api/admin/${path}`, { headers: { "X-Admin-Token": adminToken } });
      const d = await r.json();
      setAdminOut((d.output || JSON.stringify(d)).trim());
      if (!d.ok) setAdminErr("Aktion meldete einen Fehler (siehe Ausgabe).");
    } catch(e) { setAdminErr("Server nicht erreichbar."); setAdminOut(""); }
    setAdminBusy(false);
  }
  // ── Admin: user management ──────────────────────────────────────────────────
  async function adminApi(path, opts={}) {
    const headers = { "X-Admin-Token": adminToken, ...(opts.headers||{}) };
    if (opts.body) headers["Content-Type"] = "application/json";
    const r = await fetch(`/api/admin/${path}`, { ...opts, headers });
    return r.json();
  }
  async function loadUsers() {
    setUsersMsg(""); setAdminBusy(true);
    try {
      const d = await adminApi("users");
      if (d.ok) setUsers(d.users); else setUsersMsg(d.error || "Laden fehlgeschlagen.");
    } catch(e) { setUsersMsg("Server nicht erreichbar."); }
    setAdminBusy(false);
  }
  async function toggleUser(u) {
    setUsersMsg(""); setAdminBusy(true);
    try {
      const d = await adminApi("users/set-disabled",
        { method:"POST", body: JSON.stringify({ id:u.id, disabled: !u.disabled }) });
      if (d.ok) await loadUsers(); else { setUsersMsg(d.error || "Fehler."); setAdminBusy(false); }
    } catch(e) { setUsersMsg("Server nicht erreichbar."); setAdminBusy(false); }
  }
  async function resetUserPw(u) {
    const pw = (pwInputs[u.id]||"").trim();
    if (pw.length < 10) { setUsersMsg("Passwort muss mindestens 10 Zeichen haben."); return; }
    setUsersMsg(""); setAdminBusy(true);
    try {
      const d = await adminApi("users/reset-password",
        { method:"POST", body: JSON.stringify({ id:u.id, password: pw }) });
      if (d.ok) { setUsersMsg(`✓ Passwort für ${u.email} gesetzt.`); setPwInputs(p=>({...p,[u.id]:""})); }
      else setUsersMsg(d.error || "Fehler.");
    } catch(e) { setUsersMsg("Server nicht erreichbar."); }
    setAdminBusy(false);
  }
  async function deleteUser(u) {
    if (!window.confirm(`Benutzer „${u.email}" endgültig löschen?\n\nAlle Daten (Spots, Equipment, Sessions, Profil, Einstellungen) werden unwiderruflich entfernt.`)) return;
    setUsersMsg(""); setAdminBusy(true);
    try {
      const d = await adminApi("users/delete",
        { method:"POST", body: JSON.stringify({ id:u.id }) });
      if (d.ok) { setUsersMsg(`✓ Benutzer ${u.email} gelöscht.`); await loadUsers(); }
      else { setUsersMsg(d.error || "Fehler."); setAdminBusy(false); }
    } catch(e) { setUsersMsg("Server nicht erreichbar."); setAdminBusy(false); }
  }

  // Remember a location in the rolling "last 5" history (dedupe by coords,
  // most-recent first). Covers both manual entries and the GPS location.
  //
  // Source of truth is the SERVER (per-user) — iOS Safari silently drops
  // localStorage (Private Browsing / "Block All Cookies" / ITP purge), so the
  // old localStorage-only list kept vanishing on reload. We still mirror to
  // localStorage as an offline cache. Pass {active:true} to also persist it as
  // the saved/default spot ("★ merken").
  function pushRecent(l, opts) {
    if(!l || l.lat==null || l.lon==null) return;
    const active = !!(opts && opts.active);
    const key = x => `${(+x.lat).toFixed(4)},${(+x.lon).toFixed(4)}`;
    const k = key(l);
    const entry = { lat:+l.lat, lon:+l.lon, name:l.name };
    const next = [entry, ...recent.filter(r=>key(r)!==k)].slice(0,8);
    setRecent(next); saveStored("wf_loc_recent", next);
    if(active) saveStored("wf_loc", l);
    fetch("/api/locations",{method:"POST",credentials:"include",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({lat:+l.lat,lon:+l.lon,name:l.name,setActive:active})})
      .then(r=>r.ok?r.json():null)
      .then(d=>{ if(d&&Array.isArray(d.recent)){ setRecent(d.recent); saveStored("wf_loc_recent",d.recent); } })
      .catch(()=>{});
  }

  const S={
    wrap:{fontFamily:"'Barlow',sans-serif",background:C.bg,color:C.text,minHeight:"100vh",fontSize:14},
    hdr:{background:C.headerBg,borderBottom:`1px solid ${C.border}`,padding:"8px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6,position:"sticky",top:0,zIndex:100},
    locBar:{background:C.panel,borderBottom:`2px solid ${C.sky}`,padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8},
    riderBar:{background:C.panel,borderBottom:`1px solid ${C.border}`,borderTop:`2px solid ${C.signal}`,padding:"14px 20px"},
    main:{padding:"14px clamp(10px,3vw,18px) calc(40px + env(safe-area-inset-bottom))",maxWidth:1200,margin:"0 auto"},
    card:{background:C.panel,border:`1px solid ${C.border2}`,borderRadius:8,padding:"12px 16px",marginBottom:12},
    sec:{fontFamily:"monospace",fontSize:9,textTransform:"uppercase",letterSpacing:"0.1em",color:C.muted,marginBottom:8},
    btn:{background:C.signal,color:"#fff",border:"none",borderRadius:4,fontWeight:700,fontSize:13,padding:"7px 18px",cursor:"pointer",fontFamily:"monospace"},
    btnG:{background:"transparent",border:`1px solid ${C.border2}`,color:C.muted,borderRadius:4,fontSize:12,padding:"4px 10px",cursor:"pointer"},
    inp:{background:C.bg,border:`1px solid ${C.border2}`,color:C.text,borderRadius:4,padding:"5px 8px",fontFamily:"monospace",fontSize:12,outline:"none"},
    fl:{fontFamily:"monospace",fontSize:9,color:C.muted,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:4},
    fi:{background:C.bg,border:`1px solid ${C.border2}`,color:C.text,borderRadius:4,padding:"0 10px",fontFamily:"monospace",fontSize:14,outline:"none",height:40,width:"100%",boxSizing:"border-box"},
    grid2:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:12,marginBottom:12},
    grid6:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:8,marginBottom:12},
    cw:{height:190}, cwL:{height:210},
  };

  return (
    <div style={S.wrap}>
      {/* HEADER */}
      <header style={S.hdr}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <svg width="38" height="38" viewBox="0 0 32 32" fill="none" style={{display:"block",flexShrink:0}} aria-label="WindFoil">
            <path d="M5 11.5h11.5a2.7 2.7 0 1 0-2.7-2.7" stroke={C.signal} strokeWidth="2.6" strokeLinecap="round"/>
            <path d="M5 20.5h15a2.7 2.7 0 1 1-2.7 2.7" stroke={C.signal} strokeWidth="2.6" strokeLinecap="round"/>
            <path d="M5 16h6.6a2.3 2.3 0 1 0-2.3-2.3" stroke={C.muted} strokeWidth="2.4" strokeLinecap="round"/>
          </svg>
          <div>
            <div style={{fontFamily:"monospace",fontWeight:900,fontSize:15,letterSpacing:"0.15em",color:C.text}}>WINDFOIL</div>
            <div style={{fontFamily:"monospace",fontSize:9,color:C.muted,letterSpacing:"0.1em"}}>{t('version_label')}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:12,alignItems:"center"}}>
          <span style={{display:"flex",gap:6,fontSize:9,fontFamily:"monospace"}}>
            <span title="Forecast API">FC:{apiStatus.forecast}</span>
            <span title="Historical API">ERA5:{apiStatus.historical}</span>
          </span>
          {/* Sport-Umschalter */}
          <div style={{display:"flex",gap:3}}>
            {[{k:"foil",lk:"sport_foil"},{k:"kite",lk:"sport_kite"}].map(({k,lk})=>(
              <button key={k} onClick={()=>setSport(k)} style={{background:sport===k?C.signal:"transparent",border:`1px solid ${sport===k?C.signal:C.border2}`,color:sport===k?"#fff":C.muted,borderRadius:3,padding:"3px 10px",fontFamily:"monospace",fontSize:10,cursor:"pointer"}}>
                {t(lk)}
              </button>
            ))}
          </div>
          <div style={{display:"flex",gap:3}}>
            {["ms","kn","bf"].map(u=>(
              <button key={u} onClick={()=>setWindUnit(u)} style={{background:windUnit===u?C.signal:"transparent",border:`1px solid ${windUnit===u?C.signal:C.border2}`,color:windUnit===u?"#fff":C.muted,borderRadius:3,padding:"2px 7px",fontFamily:"monospace",fontSize:10,cursor:"pointer",textTransform:"uppercase"}}>
                {u==="ms"?"m/s":u==="kn"?"kn":"BF"}
              </button>
            ))}
          </div>
          <button onClick={()=>setTheme(theme==="light"?"dark":"light")}
            title={theme==="light"?"Dark Mode":"Light Mode"}
            style={{background:"transparent",border:`1px solid ${C.border2}`,color:C.muted,borderRadius:3,padding:"2px 8px",fontFamily:"monospace",fontSize:13,cursor:"pointer",lineHeight:1.2}}>
            {theme==="light"?"☾":"☀"}
          </button>
          <button onClick={()=>{ const nl=langState==="de"?"en":"de"; setLangState(nl); savePref("wf_lang",nl); }}
            style={{background:"transparent",border:`1px solid ${C.border2}`,color:C.muted,borderRadius:3,padding:"2px 8px",fontFamily:"monospace",fontSize:10,cursor:"pointer"}}>
            {langState==="de"?"EN":"DE"}
          </button>
          {activeUsers!=null && <span title={t('active_users_title')} style={{fontFamily:"monospace",fontSize:10,color:C.muted,display:"flex",alignItems:"center",gap:3}}>
            <span style={{width:6,height:6,borderRadius:"50%",background:C.go,display:"inline-block"}}/>
            {activeUsers}
          </span>}
          <a href="https://paypal.me/boehmemaik" target="_blank" rel="noopener noreferrer"
            title={t('footer_support_title')}
            style={{background:"transparent",border:`1px solid ${C.border2}`,color:C.muted,borderRadius:3,padding:"2px 8px",fontFamily:"monospace",fontSize:11,cursor:"pointer",textDecoration:"none",lineHeight:"1.6"}}>
            {t('footer_donate')}
          </a>
          <span style={{fontFamily:"monospace",fontSize:13,color:C.signal}}>{clock}</span>
        </div>
      </header>

      {/* LOC BAR */}
      <div style={S.locBar}>
        <div style={{display:"flex",alignItems:"center",gap:10,fontSize:15}}>
          <span style={{fontSize:20}}>📍</span>
          <b style={{color:"#fff",fontSize:16,letterSpacing:"0.02em"}}>{loc.name}</b>
          <span style={{fontFamily:"monospace",fontSize:11,color:C.sky}}>{loc.lat.toFixed(4)}°N, {loc.lon.toFixed(4)}°E</span>
          {spotCal && spotCal.rolling!=null && (
            <span title={`Abhebe-Schwellenwert aus ${spotCal.samples} Session(s) an diesem Spot — gilt nur lokal`}
              style={{fontFamily:"monospace",fontSize:10,color:C.go,background:"rgba(61,220,132,0.12)",border:`1px solid ${C.go}`,borderRadius:4,padding:"2px 7px"}}>
              {t('loc_calibrated',{kn:spotCal.rolling})}
            </span>
          )}
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <button style={{...S.btnG,borderColor:locSaved?C.go:C.border2,color:locSaved?C.go:C.muted}}
            title={t('loc_remember')}
            onClick={()=>{ pushRecent(loc,{active:true}); setLocSaved(true); setTimeout(()=>setLocSaved(false),2000); }}>
            {locSaved ? t('loc_remembered') : t('loc_remember')}
          </button>
          <button style={S.btnG} onClick={()=>setShowLoc(true)}>{t('loc_change')}</button>
          <button style={{...S.btnG,borderColor:C.signal,color:C.signal}}
            title={t('loc_feedback')}
            onClick={()=>setShowFeedback(true)}>{t('loc_feedback')}</button>
        </div>
      </div>

      {/* RIDER BAR */}
      <div style={S.riderBar}>
        <div style={{fontFamily:"monospace",fontSize:11,textTransform:"uppercase",letterSpacing:"0.12em",color:C.signal,marginBottom:12,fontWeight:700}}>{sport==="kite"?t('profile_kite'):t('profile_foil')} &amp; {t('profile_and_equip')}</div>

        {/* Rider fields — unified grid */}
        {sport==="foil" && <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(155px,1fr))",gap:10,marginBottom:10}}>
          {[
            {lk:"field_weight",k:"weight",step:1,min:40,max:150},
            {lk:"field_wing",k:"wingSize",step:.5,min:2,max:12},
          ].map(f=>(
            <div key={f.k}>
              <label style={S.fl}>{t(f.lk)}</label>
              <input type="number" value={ri[f.k]} step={f.step} min={f.min} max={f.max}
                onChange={e=>setRi(r=>({...r,[f.k]:parseFloat(e.target.value)}))}
                style={S.fi} />
            </div>
          ))}
          <div>
            <label style={S.fl}>{t('field_skill')}</label>
            <select value={ri.skill} onChange={e=>setRi(r=>({...r,skill:e.target.value}))} style={S.fi}>
              {["beginner","intermediate","advanced","pro"].map(s=><option key={s} value={s}>{t(`skill_${s}`)}</option>)}
            </select>
          </div>
          <div>
            <label style={S.fl} title={t('field_plane_kn_title')}>{t('field_plane_kn')}</label>
            <input type="number" value={ri.planeKn} step={0.5} min={4} max={30} placeholder={t('field_plane_placeholder')}
              onChange={e=>setRi(r=>({...r,planeKn:e.target.value}))}
              style={S.fi} />
          </div>
        </div>}

        {/* ── KITE-MODUS ── */}
        {sport==="kite" && <div style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:10}}>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            <label style={{fontFamily:"monospace",fontSize:9,color:C.muted,textTransform:"uppercase"}}>{t('field_weight')}</label>
            <input type="number" value={kiteRi.weight} step={1} min={40} max={150}
              onChange={e=>setKiteRi(r=>({...r,weight:parseFloat(e.target.value)}))}
              style={{...S.inp,width:100,fontSize:13}} />
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            <label style={{fontFamily:"monospace",fontSize:9,color:C.muted,textTransform:"uppercase"}}>{t('kite_model_label')}</label>
            <select value={kiteRi.kiteModel}
              onChange={e=>{
                const model=e.target.value;
                const firstSize=CRAZYFLY_KITES.find(k=>k.model===model)?.sizes[0]?.m??9;
                setKiteRi(r=>({...r,kiteModel:model,kiteSize:firstSize}));
              }}
              style={{...S.inp,width:120,fontSize:13}}>
              {CRAZYFLY_KITES.map(k=><option key={k.model} value={k.model}>{k.model}</option>)}
            </select>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            <label style={{fontFamily:"monospace",fontSize:9,color:C.muted,textTransform:"uppercase"}}>{t('kite_size_label')}</label>
            <select value={kiteRi.kiteSize}
              onChange={e=>setKiteRi(r=>({...r,kiteSize:parseInt(e.target.value)}))}
              style={{...S.inp,width:300,fontSize:13}}>
              {(CRAZYFLY_KITES.find(k=>k.model===kiteRi.kiteModel)?.sizes??[]).map(s=>{
                const adjW=calcKiteWindow(s.minKn,s.maxKn,"intermediate",kiteRi.weight);
                return <option key={s.m} value={s.m}>{s.m} m  ·  Hersteller {s.minKn}–{s.maxKn} kn  ·  für {kiteRi.weight}kg {Math.round(msToKn(adjW.minWind))}–{Math.round(msToKn(adjW.maxWind))} kn</option>;
              })}
            </select>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            <label style={{fontFamily:"monospace",fontSize:9,color:C.muted,textTransform:"uppercase"}}>{t('field_skill')}</label>
            <select value={kiteRi.skill} onChange={e=>setKiteRi(r=>({...r,skill:e.target.value}))}
              style={{...S.inp,width:140,fontSize:13}}>
              {["beginner","intermediate","advanced","pro"].map(s=><option key={s} value={s}>{t(`skill_${s}`)}</option>)}
            </select>
          </div>
        </div>}

        {/* Action buttons */}
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
          <button style={{...S.btn,flex:"1 1 180px",touchAction:"manipulation"}}
            onClick={()=>{ if(sport==="kite"){ setKiteRider({...kiteRi}); } else { setRider({...ri}); } setActiveDay(0); }}>{t('btn_analyse')}</button>
          <button style={{...S.btn,flex:"1 1 180px",background:"transparent",border:`1px solid ${C.go}`,color:C.go,touchAction:"manipulation"}}
            onClick={()=>{ savePref("wf_rider",ri); setRider({...ri}); setProfileSaved(true); setTimeout(()=>setProfileSaved(false),2000); }}>
            {profileSaved ? t('btn_profile_saved') : t('btn_save_profile')}
          </button>
        </div>

        {/* EQUIPMENT MANAGER */}
        <div style={{paddingTop:12,borderTop:`1px solid ${C.border}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontFamily:"monospace",fontSize:9,textTransform:"uppercase",letterSpacing:"0.1em",color:C.muted}}>{t('equip_title')}</span>
            <label style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:useGear?C.go:C.muted,cursor:"pointer"}}>
              <input type="checkbox" checked={useGear} onChange={e=>{setUseGear(e.target.checked); savePref("wf_usegear",e.target.checked); setActiveDay(0);}} />
              {t('equip_auto_select')}
            </label>
          </div>

          {/* existing gear chips */}
          {gear.length>0 && (
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
              {gear.map(g=>{
                const isRec = useGear && dayData?.pickedGear?.id===g.id;
                return (
                <div key={g.id} style={{display:"flex",alignItems:"center",gap:6,background:isRec?`${C.go}1e`:C.bg,border:`1px solid ${isRec?C.go:C.border2}`,borderRadius:6,padding:"5px 8px",fontSize:11}}>
                  {isRec && <span title="heute empfohlen" style={{color:C.go,fontWeight:700}}>✓</span>}
                  <span style={{color:isRec?C.go:C.text,fontWeight:isRec?700:400}}>{g.name||`${g.wing}m²`}</span>
                  <span style={{color:C.muted,fontFamily:"monospace",fontSize:10}}>{g.wing}m²{g.planeKn?` · ab ${g.planeKn}kn`:""}</span>
                  <button onClick={()=>{const ng=gear.filter(x=>x.id!==g.id); setGear(ng); savePref("wf_gear",ng); setActiveDay(0);}}
                    style={{background:"none",border:"none",color:C.stop,cursor:"pointer",fontSize:13,padding:0,lineHeight:1}}>×</button>
                </div>
                );})}
            </div>
          )}

          {/* add new gear — unified grid */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:8,alignItems:"end"}}>
            <div>
              <label style={S.fl}>{t('equip_name')}</label>
              <input value={newGear.name} placeholder={t('equip_name_placeholder')} onChange={e=>setNewGear(g=>({...g,name:e.target.value}))} style={{...S.fi,height:38}} />
            </div>
            <div>
              <label style={S.fl}>{t('equip_wing')}</label>
              <input type="number" step={0.5} value={newGear.wing} onChange={e=>setNewGear(g=>({...g,wing:e.target.value}))} style={{...S.fi,height:38}} />
            </div>
            <div>
              <label style={S.fl}>{t('equip_plane')}</label>
              <input type="number" step={0.5} value={newGear.planeKn} placeholder="opt." onChange={e=>setNewGear(g=>({...g,planeKn:e.target.value}))} style={{...S.fi,height:38}} />
            </div>
            <div>
              <label style={S.fl}>&nbsp;</label>
              <button style={{...S.btn,width:"100%",height:38,fontSize:11,padding:0,touchAction:"manipulation"}}
                onClick={()=>{
                  if(!newGear.wing) return;
                  const entry={...newGear,id:Date.now()};
                  const ng=[...gear,entry];
                  setGear(ng); savePref("wf_gear",ng);
                  setNewGear({name:"",wing:"5.0",planeKn:""});
                  setActiveDay(0);
                }}>{t('equip_add')}</button>
            </div>
          </div>
          {useGear && gear.length===0 && (
            <p style={{fontSize:10,color:C.caution,marginTop:8}}>{t('equip_none_hint')}</p>
          )}
        </div>
      </div>

      <div style={S.main}>

        {/* LOADING */}
        {loading && (
          <div style={{textAlign:"center",padding:"60px 0",color:C.muted}}>
            <div style={{fontSize:40,marginBottom:12,display:"inline-block",animation:"spin 1s linear infinite"}}>⟳</div>
            <p style={{fontFamily:"monospace",fontSize:13,marginBottom:6}}>{loadMsg}</p>
            <p style={{fontFamily:"monospace",fontSize:10,color:C.dim}}>{t('loading_demo_hint')}</p>
          </div>
        )}

        {!loading && forecast && dayData && (
          <>
            {/* BADGES ROW */}
            <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:12}}>
              {[
                {icon:"💨",label:t('badge_avg',{w:fmtW(dayData.avgW,windUnit)}),c:dayData.avgW>=dayData.win.optMin&&dayData.avgW<=dayData.win.optMax?C.go:dayData.avgW<dayData.win.minWind?C.stop:C.caution},
                {icon:"⬆",label:t('badge_max_gust',{w:fmtW(dayData.maxG,windUnit)}),c:dayData.maxG>dayData.win.maxWind?C.stop:C.caution},
                {icon:"🌡",label:t('badge_max_temp',{t:dayData.maxT.toFixed(0)}),c:C.sky},
                {icon:dayData.thInfo.icon,label:thermikLabel(dayData.thInfo),c:dayData.thInfo.color},
                ...(()=>{ // Correction badge: shows WHERE the thermal boost comes from.
                  const tc=dayData.thermal;
                  if(tc && tc.source==="mos"){
                    const sign = tc.addMs<0 ? "−" : "+";
                    return [{icon:"🎯",label:t('badge_mos_corr',{sign,w:fmtW(Math.abs(tc.addMs),windUnit),n:tc.n}),c:C.signal}];
                  }
                  if(tc && tc.source==="blend"){
                    const pct=Math.round(tc.mosWeight*100);
                    return [{icon:"🎯",label:t('badge_mos_blend',{pct,rest:100-pct}),c:C.signal}];
                  }
                  return dayData.sb.active?[{icon:"🌊",label:t('badge_seabreeze',{w:fmtW(dayData.sb.boost,windUnit)}),c:C.sky}]:[];
                })(),
              ].map((b,i)=>(
                <div key={i} style={{border:`1px solid ${b.c}`,borderRadius:4,padding:"6px 10px",fontSize:12,color:b.c,display:"flex",alignItems:"center",gap:6,background:C.surface}}>
                  {b.icon} {b.label}
                </div>
              ))}
            </div>

            {/* DAY TABS */}
            <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
              {dayNames.map((name,d)=>{
                const rawSc=dayScores[d];
                const tabConf=(d===0 && stationCmp?.available)?stationCmp.confidence:null;
                const sc=tabConf!=null?applyConfidence(rawSc,tabConf).score:rawSc;
                const active=d===activeDay;
                const icon=sc>=75?"✅":sc>=45?"⚠️":"❌";
                const uncertain=d>=4;
                return(
                  <button key={d} onClick={()=>setActiveDay(d)} style={{
                    background:active?C.signal:C.surface, border:`1px solid ${active?C.signal:C.border2}`,
                    color:active?"#fff":C.muted, borderRadius:4, padding:"8px 14px", cursor:"pointer",
                    display:"flex", flexDirection:"column", alignItems:"center", gap:2, minWidth:90,
                    opacity:uncertain?0.72:1 }}>
                    <span style={{fontSize:14}}>{icon}</span>
                    <span style={{fontFamily:"monospace",fontSize:9,textTransform:"uppercase"}}>{name}</span>
                    <span style={{fontFamily:"monospace",fontWeight:900,fontSize:18,color:active?"#fff":sc2col(sc)}}>{sc}</span>
                    {uncertain&&<span style={{fontSize:7,color:active?"rgba(255,255,255,.6)":C.caution,fontFamily:"monospace",letterSpacing:"0.05em"}}>{t('day_uncertain')}</span>}
                  </button>
                );
              })}
            </div>

            {/* FOIL-SCORE */}
            {(()=>{
              const conf = (activeDay===0 && stationCmp?.available) ? stationCmp.confidence : null;
              const adj = applyConfidence(dayData.dayScore, conf);
              const cc = classifyConfidence(conf);
              const scoreColor = sc2col(adj.score);
              return (
                <div style={{...S.card,marginBottom:12,display:"flex",alignItems:"center",gap:20,flexWrap:"wrap",borderLeft:`3px solid ${scoreColor}`,background:`linear-gradient(90deg,${scoreColor}12 0%,${C.panel} 40%)`}}>
                  <div style={{textAlign:"center",minWidth:100}}>
                    <div style={{fontFamily:"monospace",fontWeight:900,fontSize:56,color:scoreColor,lineHeight:1}}>{adj.score}</div>
                    <div style={{fontFamily:"monospace",fontSize:9,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginTop:4}}>{sport==="kite"?t('score_kite'):t('score_foil')}</div>
                    {adj.adjusted && <div style={{fontSize:9,color:C.caution,marginTop:3}}>{t('score_raw_adj',{raw:dayData.dayScore})}</div>}
                  </div>
                  <div style={{flex:1,minWidth:160}}>
                    {dayData.session && dayData.session.startHour!=null && dayData.dayScore>0 && (
                      <div style={{fontSize:14,color:C.go,fontFamily:"monospace",fontWeight:700,marginBottom:4}}>
                        {t('score_best_time',{from:String(dayData.session.startHour).padStart(2,"0"),to:String(dayData.session.endHour).padStart(2,"0")})}
                      </div>
                    )}
                    {dayData.pickedGear ? (
                      <div style={{display:"inline-flex",alignItems:"center",gap:8,flexWrap:"wrap",background:`${C.go}1e`,border:`1px solid ${C.go}`,borderRadius:8,padding:"7px 12px"}}>
                        <span style={{fontSize:16}}>🎒</span>
                        <span style={{fontFamily:"monospace",fontSize:9,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em"}}>{t('score_auto_rec')}</span>
                        <b style={{fontSize:15,color:C.go,fontFamily:"monospace"}}>{dayData.pickedGear.name||`${dayData.pickedGear.wing} m²`}</b>
                        <span style={{fontSize:11,color:C.muted}}>· {dayData.pickedGear.wing} m² · {rider.weight} kg</span>
                      </div>
                    ) : (
                      <div style={{fontSize:11,color:C.muted}}>{sport==="kite"?`${kiteRider.kiteModel} ${kiteRider.kiteSize}m · ${kiteRider.weight}kg · ${kiteRider.skill}`:`${rider.weight}kg · ${rider.wingSize}m²${rider.planeKn?` · ab ${rider.planeKn}kn`:""}`}</div>
                    )}
                    {conf!=null && (
                      <div style={{marginTop:6,fontSize:11,color:cc.color}}>{cc.icon} {confidenceLabel(cc)} ({conf}%)</div>
                    )}
                    {dayData.liveBoost?.applied && (
                      <div style={{marginTop:6,fontSize:10,color:C.signal,fontFamily:"monospace"}}>
                        {dayData.liveBoost.nowKn != null
                          ? `↑ Live-Station ${dayData.liveBoost.station}: jetzt ~${dayData.liveBoost.nowKn} kn`
                          : `↑ an Live-Station ${dayData.liveBoost.station} angepasst (×${dayData.liveBoost.k})`}
                      </div>
                    )}
                    {dayData.measuredCorr?.applied && (
                      <div style={{marginTop:6,fontSize:10,color:C.signal,fontFamily:"monospace"}}>
                        ↑ an Station {dayData.measuredCorr.station}{dayData.measuredCorr.km >= 2 ? ` (~${dayData.measuredCorr.km} km)` : ""} angepasst
                      </div>
                    )}
                    {forecast?.__model && MODEL_LABELS[forecast.__model] && (
                      <div style={{marginTop:6,fontSize:10,color:C.muted,fontFamily:"monospace"}}>
                        {t('source_label')} {MODEL_LABELS[forecast.__model]}{(dayData.thermal?.source==="neural_mos"||dayData.thermal?.source==="neural_blend") ? ` + ${t('neural_mos')}` : (dayData.thermal?.source==="mos"||dayData.thermal?.source==="blend") ? ` + ${t('mos_label')}` : ""}{dayData.liveBoost?.applied ? ` + ${t('live_station')}` : dayData.measuredCorr?.applied ? ` + ${t('meas_station')}` : ""}
                      </div>
                    )}
                    {mos?.meltemProb != null && (
                      <div style={{marginTop:6,fontSize:10,fontFamily:"monospace",
                        color: mos.meltemProb >= 0.6 ? C.go : mos.meltemProb >= 0.35 ? C.caution : C.muted}}>
                        {t('foil_info_meltemi',{pct:Math.round(mos.meltemProb * 100)})}
                        {mos.neuralActive ? t('foil_info_neural') : ""}
                      </div>
                    )}
                  </div>
                </div>
              );
            })()}

            {/* RECOMMENDATION */}
            <div style={{...S.card,borderLeft:`3px solid ${C.go}`}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <span>🎯</span>
                <strong style={{color:C.go,fontSize:13}}>{t('equip_rec_title')}</strong>
              </div>
              <div style={{fontSize:12,color:C.muted,lineHeight:1.9}} dangerouslySetInnerHTML={{__html:rec}} />
            </div>

            {/* FOIL WINDOW */}
            <div style={S.card}>
              <div style={S.sec}>{sport==="kite"?t('kite_window_title'):t('foil_window_title')}</div>
              {meas && <div style={{fontSize:10,color:C.muted,fontFamily:"monospace",marginBottom:6}}>
                Weiß/rot = echte Station ({measured.source}{measured.km>=2?`, ~${measured.km} km entfernt`:""}{measured.latest?`, zuletzt ${measured.latest}`:""}) vs. Forecast (blau/orange)
              </div>}
              {live && live.wind!=null && <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",margin:"2px 0 8px",padding:"6px 10px",borderRadius:8,background:"rgba(61,220,132,0.08)",border:`1px solid ${C.go}44`,fontSize:11}}>
                <span style={{display:"inline-flex",alignItems:"center",gap:5,color:C.go,fontWeight:600,whiteSpace:"nowrap"}}>
                  <span style={{width:7,height:7,borderRadius:"50%",background:live.sensorOk?C.go:C.stop,boxShadow:`0 0 6px ${live.sensorOk?C.go:C.stop}`}} />
                  {t('live_now_label')}
                </span>
                <span style={{color:C.text,fontFamily:"monospace"}}>
                  {fmtW(live.wind,windUnit)} {unitLabel(windUnit)}
                  {live.gust!=null && <> · Böe {fmtW(live.gust,windUnit)}</>}
                  {live.dir!=null && <> · {compass(live.dir)} {Math.round(live.dir)}°</>}
                </span>
                <span style={{color:C.muted,fontFamily:"monospace",fontSize:10}}>
                  {live.source}{live.time?` · ${live.time}`:""}{live.sensorOk?"":t('live_sensor_lost')}
                </span>
              </div>}
              <div style={S.cwL}>
                <ResponsiveContainer width="100%" height="100%">
                  <ComposedChart data={windData} margin={{top:5,right:5,bottom:gearByHour&&gearByHour.some(g=>g)?20:5,left:5}}>
                    {/* Zuerst gerendert ⇒ liegt unter allen Linien. */}
                    {dayData.ens && <Area yAxisId="l" dataKey="band" name="Modell-Streuung" stroke="none" fill={C.sky} fillOpacity={0.12} isAnimationActive={false} legendType="none" />}
                    <CartesianGrid {...gr} />
                    <XAxis dataKey="h" {...ax} interval={gearByHour?0:3} tick={gearByHour?<FensterTick ghour={gearByHour.slice(6)} lbls={dayData.labels.slice(6)}/>:undefined} />
                    <YAxis yAxisId="l" {...ax} />
                    <YAxis yAxisId="r" orientation="right" domain={[0,100]} {...ax} tick={{...ax.tick,fill:C.go}} />
                    <Tooltip {...TT} />
                    <Legend verticalAlign="top" wrapperStyle={{fontSize:10,fontFamily:"monospace",color:C.muted,paddingBottom:4}} />
                    <ReferenceArea yAxisId="l" y1={cvt(dayData.win.optMin,windUnit)} y2={cvt(dayData.win.optMax,windUnit)} fill="rgba(61,220,132,0.10)" stroke="rgba(61,220,132,0.3)" />
                    <ReferenceLine yAxisId="l" y={cvt(dayData.win.minWind,windUnit)} stroke={C.caution} strokeDasharray="4 3" />
                    <Line yAxisId="l" type="monotone" dataKey="wind" name={t('wind_label',{u:unitLabel(windUnit)})} stroke={C.sky} strokeWidth={2} dot={false} />
                    <Line yAxisId="l" type="monotone" dataKey="gust" name={t('gust_label',{u:unitLabel(windUnit)})} stroke={C.signal} strokeDasharray="4 3" strokeWidth={1.5} dot={false} />
                    {meas && windData.some(d=>d.mwind!=null) && <Line yAxisId="l" type="monotone" dataKey="mwind" name={t('mwind_label',{u:unitLabel(windUnit)})} stroke={C.text} strokeWidth={2} dot={false} connectNulls />}
                    {meas && windData.some(d=>d.mgust!=null) && <Line yAxisId="l" type="monotone" dataKey="mgust" name={t('mgust_label',{u:unitLabel(windUnit)})} stroke={C.stop} strokeDasharray="2 2" strokeWidth={1.5} dot={false} connectNulls />}
                    {(()=>{ // live "now" marker — only on today's tab, at the current clock hour
                      if(!(live && activeDay===0 && live.wind!=null && live.time)) return null;
                      const lh=`${live.time.slice(0,2)}:00`;
                      if(!windData.some(d=>d.h===lh)) return null;
                      return <ReferenceDot yAxisId="l" x={lh} y={cvt(live.wind,windUnit)} r={5} fill={C.go} stroke="#fff" strokeWidth={1.5} ifOverflow="extendDomain" label={{value:"Live",position:"top",fontSize:9,fill:C.go,fontFamily:"monospace"}} />;
                    })()}
                    <Line yAxisId="r" type="monotone" dataKey="score" name={sport==="kite"?t('kite_score_chart'):t('foil_score_chart')} stroke={C.go} strokeWidth={1.5} dot={false} strokeOpacity={0.8} />
                  </ComposedChart>
                </ResponsiveContainer>
              </div>
            </div>

            {/* CRAZYFLY REFERENCE PANEL (kite mode only) */}
            {sport==="kite" && (
              <div style={S.card}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:4}}>
                  <span style={S.sec}>{t('kite_window_ref')}</span>
                  <span style={{fontFamily:"monospace",fontSize:9,color:C.muted}}>crazyflykites.com · Stand 2026</span>
                </div>
                <div style={{fontSize:10,color:C.muted,marginBottom:10,lineHeight:1.5}}>
                  {lang==="en"
                    ? <>Manufacturer specs (reference weight ~80 kg). Second column shows your adjusted window for <b style={{color:C.text}}>{kiteRider.weight} kg · {t(`skill_${kiteRider.skill}`)}</b>.</>
                    : <>Herstellerangaben (Referenzgewicht ~80 kg). Die zweite Spalte zeigt dein angepasstes Fenster für <b style={{color:C.text}}>{kiteRider.weight} kg · {t(`skill_${kiteRider.skill}`)}</b>.</>}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:8}}>
                  {CRAZYFLY_KITES.map(kite=>(
                    <div key={kite.model} style={{background:C.bg,border:`1px solid ${kiteRider.kiteModel===kite.model?C.signal:C.border2}`,borderRadius:6,padding:"10px 12px"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}>
                        <b style={{fontFamily:"monospace",fontSize:12,color:kiteRider.kiteModel===kite.model?C.signal:C.text}}>{kite.model}</b>
                        <span style={{fontSize:9,color:C.muted}}>{kite.desc}</span>
                      </div>
                      <div style={{display:"grid",gridTemplateColumns:"auto 1fr 1fr",gap:"3px 8px",fontSize:10,color:C.dim,marginBottom:4,paddingLeft:6}}>
                        <span></span><span>{t('ref_manufacturer')}</span><span>{kiteRider.weight} kg</span>
                      </div>
                      {kite.sizes.map(s=>{
                        const isActive=kiteRider.kiteModel===kite.model&&kiteRider.kiteSize===s.m;
                        const adj=calcKiteWindow(s.minKn,s.maxKn,kiteRider.skill,kiteRider.weight);
                        return(
                          <div key={s.m} style={{display:"grid",gridTemplateColumns:"auto 1fr 1fr",gap:"3px 8px",
                            fontSize:11,color:isActive?C.go:C.muted,marginBottom:3,
                            borderLeft:`2px solid ${isActive?C.go:"transparent"}`,paddingLeft:6}}>
                            <span>{s.m} m</span>
                            <span style={{fontFamily:"monospace",color:C.dim}}>{s.minKn}–{s.maxKn} kn</span>
                            <span style={{fontFamily:"monospace",color:isActive?C.go:C.muted}}>{Math.round(msToKn(adj.minWind))}–{Math.round(msToKn(adj.maxWind))} kn</span>
                          </div>
                        );
                      })}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* HARLEM PACE REFERENCE PANEL (foil mode only) */}
            {sport==="foil" && (
              <div style={S.card}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:4}}>
                  <span style={S.sec}>{t('foil_window_ref')}</span>

                      <div style={{background:C.bg,border:`1px solid ${C.border2}`,borderRadius:6,padding:"8px 10px"}}>

                            {n!=null && <div style={{fontFamily:"monospace",fontSize:8,color:C.dim,marginTop:4}}>{t('n_member',{n})}</div>}
                          </div>

                      {SAVED_SPOTS.map((s,i)=>(
                        <button key={i} onClick={()=>{ setLoc(s); pushRecent(s,{active:true}); setShowLoc(false); }}
                          style={{background:C.bg,border:`1px solid ${C.border2}`,borderRadius:4,color:C.text,textAlign:"left",padding:"8px 12px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                          <span>
                            <b style={{display:"block",fontSize:13}}>📍 {s.name}</b>
                            <span style={{fontSize:10,color:C.muted,fontFamily:"monospace"}}>{s.lat.toFixed(4)}°N {s.lon.toFixed(4)}°E · {s.desc}</span>
                          </span>
                          <span style={{fontSize:12,color:C.signal}}>★</span>
                        </button>
                      ))}
                    </div>
                  </div>
                );
              })()}
              {recent.length>0&&(
                <div style={{marginBottom:14}}>
                  <div style={{fontFamily:"monospace",fontSize:10,color:C.muted,marginBottom:6,textTransform:"uppercase",letterSpacing:"0.08em"}}>{t('loc_recent_section')}</div>
                  <div style={{display:"flex",flexDirection:"column",gap:6}}>
                    {recent.map((r,i)=>(
                      <button key={i} onClick={()=>{ setLoc(r); pushRecent(r,{active:true}); setShowLoc(false); }}
                        style={{background:C.bg,border:`1px solid ${C.border2}`,borderRadius:4,color:C.text,textAlign:"left",padding:"8px 12px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                        <span>
                          <b style={{display:"block",fontSize:13}}>{r.name}</b>
                          <span style={{fontSize:10,color:C.muted,fontFamily:"monospace"}}>{(+r.lat).toFixed(4)}°N {(+r.lon).toFixed(4)}°E</span>
                        </span>
                        <span style={{fontSize:12,color:C.sky}}>↵</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}
              {/* Ort hinzufügen (Google-Maps-Link oder Koordinaten) */}
              <div style={{marginTop:14,borderTop:`1px solid ${C.border}`,paddingTop:14,display:"flex",flexDirection:"column",gap:10}}>
                <div style={{fontFamily:"monospace",fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:"0.08em"}}>{t('loc_add_section')}</div>
                <div>
                  <label style={{fontFamily:"monospace",fontSize:10,color:C.muted,display:"block",marginBottom:4}}>{t('loc_add_label')}</label>
                  <textarea value={custom.link} rows={3}
                    onChange={e=>{setCustom(c=>({...c,link:e.target.value}));setLinkError("");}}
                    placeholder="https://www.google.com/maps/@36.9833,21.6667,14z&#10;oder: 36.9833, 21.6667"
                    style={{...S.inp,width:"100%",resize:"vertical",lineHeight:1.4}} />
                </div>
                <div>
                  <label style={{fontFamily:"monospace",fontSize:10,color:C.muted,display:"block",marginBottom:4}}>{t('loc_add_name_label')}</label>
                  <input value={custom.name} onChange={e=>setCustom(c=>({...c,name:e.target.value}))}
                    placeholder={parsePlaceName(custom.link)||t('loc_add_name_placeholder')}
                    style={{...S.inp,width:"100%"}} />
                </div>
                {(()=>{ const parsed=parseLocationInput(custom.link);
                  if(custom.link&&parsed&&!parsed.error) return (
                    <div style={{fontSize:11,color:C.go,fontFamily:"monospace",background:"rgba(61,220,132,0.08)",border:`1px solid ${C.go}`,borderRadius:4,padding:"6px 10px"}}>{t('loc_parsed_ok',{lat:parsed.lat.toFixed(4),lon:parsed.lon.toFixed(4)})}</div>);
                  if(custom.link&&parsed&&parsed.error) return (
                    <div style={{fontSize:11,color:C.caution,lineHeight:1.5,background:"rgba(245,185,66,0.08)",border:`1px solid ${C.caution}`,borderRadius:4,padding:"6px 10px"}}>⚠️ {parsed.error}</div>);
                  return null; })()}
                {linkError && (<div style={{fontSize:11,color:C.stop,fontFamily:"monospace"}}>{linkError}</div>)}
                <button style={S.btn} onClick={()=>{
                  const parsed=parseLocationInput(custom.link);
                  if(!parsed){ setLinkError(t('loc_link_error_empty')); return; }
                  if(parsed.error){ setLinkError(parsed.error); return; }
                  const name=custom.name.trim()||parsePlaceName(custom.link)||`${parsed.lat.toFixed(3)}°N ${parsed.lon.toFixed(3)}°E`;
                  const nl={lat:parsed.lat,lon:parsed.lon,name};
                  setLoc(nl); pushRecent(nl,{active:true}); setCustom({link:"",name:""}); setLinkError(""); setShowLoc(false);
                }}>{t('loc_add_btn')}</button>
                <div style={{fontSize:10,color:C.dim,lineHeight:1.5}}>{t('loc_add_hint')}</div>
              </div>
            </div>
          </div>
        </div>
      )}

      <div style={{background:C.surface,borderTop:`1px solid ${C.border}`,padding:"8px 20px calc(14px + env(safe-area-inset-bottom))",textAlign:"center",fontFamily:"monospace",fontSize:9,color:C.muted,display:"flex",justifyContent:"center",alignItems:"center",gap:24,flexWrap:"wrap"}}>
        <span>WindFoil Weather Intelligence v3.28.14</span>
        <span>Open-Meteo · ERA5 ECMWF · Rider-Input</span>
        <span>{t('footer_loc',{name:loc.name})}</span>
        <a href="/help.html" style={{color:C.sky,textDecoration:"none"}}>{t('footer_help')}</a>
        <button onClick={()=>{setAdminOpen(true);setAdminErr("");setAdminOut("");setAdminTab("actions");setUsersMsg("");}}
          title="Admin"
          style={{background:"none",border:"none",color:C.dim,cursor:"pointer",fontSize:12,padding:0}}>⚙</button>
      </div>

      {/* ADMIN MODAL */}
      {adminOpen && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:C.panel,border:`1px solid ${C.border2}`,borderRadius:8,width:"100%",maxWidth:560}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",borderBottom:`1px solid ${C.border}`}}>
              <strong style={{fontFamily:"monospace",fontSize:14}}>⚙ Admin</strong>
              <button onClick={()=>{setAdminOpen(false);setAdminAuthed(false);setAdminToken("");setAdminPw("");setAdminOut("");setAdminErr("");setAdminTab("actions");setUsers([]);setUsersMsg("");setPwInputs({});}}
                style={{background:"none",border:"none",color:C.muted,fontSize:16,cursor:"pointer"}}>✕</button>
            </div>
            <div style={{padding:16}}>

              {!adminAuthed ? (
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  <label style={{fontFamily:"monospace",fontSize:10,color:C.muted}}>Admin-Passwort</label>
                  <input type="password" value={adminPw} autoFocus
                    onChange={e=>setAdminPw(e.target.value)}
                    onKeyDown={e=>{if(e.key==="Enter") adminLogin();}}
                    style={{...S.inp,width:"100%",fontSize:14}} />
                  <button style={{...S.btn,opacity:adminBusy?0.6:1}} disabled={adminBusy} onClick={adminLogin}>
                    {adminBusy?"Prüfe…":"Anmelden"}
                  </button>
                  <p style={{fontSize:9,color:C.dim,lineHeight:1.5}}>
                    Das Passwort wird serverseitig geprüft (windfoil.env). Es wird nicht im Browser gespeichert.
                  </p>
                </div>
              ) : (
                <div style={{display:"flex",flexDirection:"column",gap:12}}>
                  <div style={{display:"flex",gap:6}}>
                    {[["actions","Aktionen"],["users","Benutzer"]].map(([t,l])=>(
                      <button key={t} onClick={()=>{ setAdminTab(t); if(t==="users") loadUsers(); }}
                        style={{background:adminTab===t?C.signal:"none",border:`1px solid ${adminTab===t?C.signal:C.border2}`,color:adminTab===t?"#fff":C.muted,borderRadius:4,padding:"4px 12px",fontSize:12,cursor:"pointer"}}>{l}</button>
                    ))}
                  </div>

                  {adminTab==="actions" && (<>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    <button style={{...S.btn,opacity:adminBusy?0.6:1}} disabled={adminBusy}
                      onClick={()=>adminRun("deploy","Deployment")}>🚀 Deploy starten</button>
                    <button style={{...S.btn,background:"transparent",border:`1px solid ${C.sky}`,color:C.sky,opacity:adminBusy?0.6:1}} disabled={adminBusy}
                      onClick={()=>adminRun("restart-proxy","Proxy-Neustart")}>♻ Proxy neu starten</button>
                    <button style={{...S.btn,background:"transparent",border:`1px solid ${C.muted}`,color:C.muted,opacity:adminBusy?0.6:1}} disabled={adminBusy}
                      onClick={()=>adminRun("status","Status")}>📊 Status</button>
                  </div>
                  {adminBusy && <div style={{fontSize:11,color:C.caution}}>⏳ läuft… (kann bis zu 2 Min dauern)</div>}
                  {adminOut && (
                    <pre style={{background:C.bg,border:`1px solid ${C.border2}`,borderRadius:6,padding:"10px 12px",fontSize:11,color:C.text,fontFamily:"monospace",whiteSpace:"pre-wrap",maxHeight:340,overflow:"auto",margin:0}}>{adminOut}</pre>
                  )}
                  </>)}

                  {adminTab==="users" && (
                    <div style={{display:"flex",flexDirection:"column",gap:10}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <span style={{fontSize:11,color:C.muted,fontFamily:"monospace"}}>{users.length} Benutzer</span>
                        <button style={S.btnG} disabled={adminBusy} onClick={loadUsers}>↻ Aktualisieren</button>
                      </div>
                      {usersMsg && <div style={{fontSize:11,color:usersMsg.startsWith("✓")?C.go:C.caution}}>{usersMsg}</div>}
                      {users.length===0 && !adminBusy && <div style={{fontSize:11,color:C.dim}}>Keine Benutzer gefunden.</div>}
                      {users.map(u=>(
                        <div key={u.id} style={{background:C.bg,border:`1px solid ${C.border2}`,borderRadius:6,padding:"10px 12px",display:"flex",flexDirection:"column",gap:8}}>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                            <div style={{minWidth:0}}>
                              <div style={{fontSize:13,color:C.text,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
                                {u.name||"—"}
                                <span style={{fontSize:10,color:u.disabled?C.stop:C.go}}>{u.disabled?"● gesperrt":"● aktiv"}</span>
                              </div>
                              <div style={{fontSize:11,color:C.muted,fontFamily:"monospace",overflow:"hidden",textOverflow:"ellipsis"}}>{u.email}</div>
                            </div>
                            <button disabled={adminBusy} onClick={()=>toggleUser(u)}
                              style={{...S.btnG,borderColor:u.disabled?C.go:C.stop,color:u.disabled?C.go:C.stop,opacity:adminBusy?0.6:1}}>
                              {u.disabled?"Freischalten":"Sperren"}
                            </button>
                          </div>
                          <div style={{display:"flex",gap:6}}>
                            <input type="text" autoComplete="off" placeholder="Neues Passwort (min. 10)"
                              value={pwInputs[u.id]||""} onChange={e=>setPwInputs(p=>({...p,[u.id]:e.target.value}))}
                              style={{...S.inp,flex:1,fontSize:12}} />
                            <button disabled={adminBusy} style={S.btnG} onClick={()=>resetUserPw(u)}>PW setzen</button>
                            <button disabled={adminBusy} onClick={()=>deleteUser(u)}
                              style={{...S.btnG,borderColor:C.stop,color:C.stop,opacity:adminBusy?0.6:1}}>Löschen</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {adminErr && <div style={{fontSize:11,color:C.stop,marginTop:10}}>⚠️ {adminErr}</div>}
            </div>
          </div>
        </div>
      )}
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );
}

    const boot=document.getElementById("boot"); if(boot) boot.remove();
    ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate><App/></AuthGate>);
  </script></body></html>
